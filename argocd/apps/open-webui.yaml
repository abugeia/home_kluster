apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Source 1: chart Helm public Open WebUI
    - repoURL: https://helm.openwebui.com
      chart: open-webui
      targetRevision: 16.6.0
      helm:
        valueFiles:
          - $values/apps/ai/open-webui/values.yaml
    # Source 2: repo git pour les values
    - repoURL: 'https://github.com/abugeia/home_kluster.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  # Sablier pilote les replicas (scale-to-zero) ; RespectIgnoreDifferences
  # empêche un sync de les remettre à la valeur du manifest.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: open-webui
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
