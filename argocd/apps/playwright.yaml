apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playwright
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/abugeia/home_kluster.git
    targetRevision: main
    path: apps/ai/playwright
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  # Sablier pilote les replicas (scale-to-zero) ; RespectIgnoreDifferences
  # empêche un sync de les remettre à la valeur du manifest.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: playwright
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
