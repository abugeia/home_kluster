apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: PVC from Git repo
    - repoURL: 'https://github.com/abugeia/home_kluster.git'
      targetRevision: HEAD
      path: apps/media/immich
      directory:
        include: '{pv,pvc,pv-import,pvc-import}.yaml'
    # Source 2: Helm chart (registre OCI) with values from Git
    # Le repo HTTP https://immich-app.github.io/immich-charts a été supprimé par
    # l'upstream : il est figé à 0.12.0 et ne reçoit plus de mise à jour depuis
    # que le chart est publié en OCI (0.13.0+). Argo CD traite un repoURL sans
    # schéma comme un registre OCI — ne pas préfixer par "oci://".
    - repoURL: ghcr.io/immich-app/immich-charts
      targetRevision: 0.13.2
      chart: immich
      helm:
        valueFiles:
          - $values/apps/media/immich/values.yaml
    # Source 3: Git repo for values reference
    - repoURL: 'https://github.com/abugeia/home_kluster.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
