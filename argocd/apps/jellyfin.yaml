apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Kustomize (helmCharts + patch des labels Sablier sur le Deployment) :
  # voir apps/media/jellyfin/kustomization.yaml
  source:
    repoURL: 'https://github.com/abugeia/home_kluster.git'
    targetRevision: main
    path: apps/media/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas