apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Source 1: Additional manifests from Git repo
    - repoURL: 'https://github.com/abugeia/home_kluster.git'
      targetRevision: main
      path: apps/media/jellyfin
      directory:
        include: '{pvc.yaml,jellyfin-sso-setup-job.yaml}'
    # Source 2: Helm chart with values from Git
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      targetRevision: 3.2.0
      chart: jellyfin
      helm:
        valueFiles:
          - $values/apps/media/jellyfin/values.yaml
    # Source 3: Git repo for values reference
    - repoURL: 'https://github.com/abugeia/home_kluster.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas