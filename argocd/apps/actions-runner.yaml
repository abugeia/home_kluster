apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/abugeia/home_kluster.git'
    targetRevision: HEAD
    path: apps/storage/actions-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      # Temporaire, le temps que actions-runner-controller reprenne le
      # contrôleur et les CRDs : sans ça, cette app pourrait les supprimer
      # avant que l'autre ne les ait adoptés. À remettre à true ensuite.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
