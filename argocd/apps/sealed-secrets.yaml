# Le dépôt Helm a changé d'organisation GitHub Pages : `bitnami-labs.github.io` renvoie
# désormais 404 — index.yaml comme racine, sans redirect. ArgoCD ne pouvait plus rendre
# le chart (ComparisonError) alors que le controller déployé, lui, tournait toujours et
# déchiffrait normalement. Le README amont publie maintenant `bitnami.github.io`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    # 2.17.7 → 2.19.3, soit controller 0.32.2 → 0.39.1. Aucun breaking change annoncé
    # sur la plage, et deux fix de sécurité : `/v1/verify` ne sert plus d'oracle de
    # déchiffrement (#2019), `/v1/rotate` est rate-limité (#1971).
    #
    # Les clés privées ne sont PAS templatées par le chart : le controller les génère
    # lui-même dans des Secrets labellisés `sealedsecrets.bitnami.com/sealed-secrets-key`
    # Un upgrade de chart ne peut donc pas les écraser — et le release garde son nom,
    # donc les ressources gardent le leur.
    targetRevision: 2.22.0
    chart: sealed-secrets
    helm:
      valuesObject:
        # Rotation des clés désactivée (2026-10-23). On scelle toujours avec le
        # certificat figé `secrets/clear/sealed-secrets.pem` (clé sealed-secrets-keyd99fj,
        # valide jusqu'en 2035) : vérifié, les 35 SealedSecrets du cluster utilisent
        # cette clé, les 10 générées ensuite (une tous les 30 j) n'ont jamais servi.
        # La rotation n'apportait donc rien. "0" entre guillemets, sinon le chart
        # n'émet pas l'argument.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
