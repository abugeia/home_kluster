apiVersion: apps/v1
kind: Deployment
metadata:
  name: asa-server
  namespace: games
spec:
  replicas: 1
  strategy:
    type: Recreate # Pas de rolling update pour un game server stateful
  selector:
    matchLabels:
      app: asa-server
  template:
    metadata:
      labels:
        app: asa-server
    spec:
      securityContext:
        fsGroup: 7777
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command:
            - "sh"
            - "-c"
            - |
              echo 'Fixing permissions for ASA server directories...'
              # Le montage K8s crée certains dossiers parents en root (ex: ShooterGame)
              chown -R 7777:7777 /home/pok/arkserver
              chmod -R 755 /home/pok/arkserver
              echo 'Permissions fixed.'
          volumeMounts:
            - name: asa-serverfiles
              mountPath: /home/pok/arkserver
            - name: asa-shootergame
              mountPath: /home/pok/arkserver/ShooterGame/Saved
            - name: asa-cluster
              mountPath: /home/pok/arkserver/ShooterGame/Saved/clusters
      containers:
        - name: asa-server
          image: acekorneya/asa_server:2_1_latest
          resources:
            requests:
              memory: "16Gi"
              cpu: "2000m"
            limits:
              memory: "20Gi"
              cpu: "4000m"
          ports:
            - containerPort: 7777
              protocol: TCP
            - containerPort: 7777
              protocol: UDP
          env:
            # --- Serveur ---
            - name: TZ
              value: "Pacific/Noumea"
            - name: SESSION_NAME
              value: "ASA_NC"
            - name: MAP_NAME
              value: "TheIsland"
            - name: SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asa-secrets
                  key: ADMIN_PASSWORD
            - name: SERVER_PASSWORD
              value: ""
            - name: MAX_PLAYERS
              value: "20"
            - name: ASA_PORT
              value: "7777"
            - name: RCON_PORT
              value: "27020"
            - name: RCON_ENABLED
              value: "TRUE"
            # --- Client cracké ---
            - name: BATTLEEYE
              value: "FALSE"
            # --- Mise à jour ---
            - name: UPDATE_SERVER
              value: "TRUE"
            - name: CHECK_FOR_UPDATE_INTERVAL
              value: "24"
            - name: RESTART_NOTICE_MINUTES
              value: "15"
            # --- Divers ---
            - name: DISPLAY_POK_MONITOR_MESSAGE
              value: "FALSE"
            - name: ENABLE_MOTD
              value: "FALSE"
            - name: CLUSTER_ID
              value: "cluster"
            - name: MOD_IDS
              value: ""
            - name: CUSTOM_SERVER_ARGS
              value: ""
          volumeMounts:
            # Chemins officiels du repo GitHub
            - name: asa-serverfiles
              mountPath: /home/pok/arkserver
            - name: asa-shootergame
              mountPath: /home/pok/arkserver/ShooterGame/Saved
            - name: asa-cluster
              mountPath: /home/pok/arkserver/ShooterGame/Saved/clusters
      volumes:
        - name: asa-serverfiles
          persistentVolumeClaim:
            claimName: asa-serverfiles-pvc
        - name: asa-shootergame
          persistentVolumeClaim:
            claimName: asa-shootergame-pvc
        - name: asa-cluster
          persistentVolumeClaim:
            claimName: asa-cluster-pvc
---
# PVC pour les binaires serveur ASA + Proton/Wine (~50 Go requis de base)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asa-serverfiles-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 140Gi
---
# PVC pour ShooterGame (saves, configs, logs)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asa-shootergame-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 10Gi
---
# PVC pour le Cluster (transferts cross-serveur)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asa-cluster-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 1Gi
---
# Service UDP (Game)
apiVersion: v1
kind: Service
metadata:
  name: asa-server-udp
  namespace: games
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.103
    metallb.io/allow-shared-ip: "asa-shared-ip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: asa-server
  ports:
    - name: game-udp
      port: 7777
      targetPort: 7777
      protocol: UDP
---
# Service TCP (Game + RCON)
apiVersion: v1
kind: Service
metadata:
  name: asa-server-tcp
  namespace: games
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.103
    metallb.io/allow-shared-ip: "asa-shared-ip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: asa-server
  ports:
    - name: game-tcp
      port: 7777
      targetPort: 7777
      protocol: TCP
    - name: rcon
      port: 27020
      targetPort: 27020
      protocol: TCP
