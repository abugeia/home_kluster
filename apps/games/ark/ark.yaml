apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-server
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-server
  template:
    metadata:
      labels:
        app: ark-server
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "if [ \"$(stat -c %u /app)\" != \"1000\" ]; then echo 'Fixing permissions...'; chown -R 1000:1000 /app && chmod -R 755 /app; else echo 'Permissions already correct'; fi"]
          volumeMounts:
            - name: ark-data
              mountPath: /app
      containers:
        - name: ark-server
          image: hermsi/ark-server:latest
          args:
            - "--arkopt,-PublicIPForEpic=115.126.181.187"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          resources:
            requests:
              memory: "8Gi"
              cpu: "1000m"
            limits:
              memory: "12Gi"
              cpu: "2000m"
          ports:
            - containerPort: 7777
              protocol: UDP
            - containerPort: 7778
              protocol: UDP
            - containerPort: 27015
              protocol: UDP
            - containerPort: 27020
              protocol: TCP
          env:
            - name: SESSION_NAME
              value: "ARK_NC"
            - name: SERVER_MAP
              value: "Fjordur"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-secrets
                  key: ADMIN_PASSWORD
            # - name: ARK_ADMIN_PASSWORD # Ajout du prefixe pour compatibilité arkmanager
            #   valueFrom:
            #     secretKeyRef:
            #       name: ark-secrets
            #       key: ADMIN_PASSWORD
            - name: SERVER_PASSWORD
              value: ""
            - name: MAX_PLAYERS
              value: "20"
            - name: UPDATE_ON_START
              value: "true"
            - name: BACKUP_ON_STOP
              value: "true"
            - name: GAME_CLIENT_PORT
              value: "7777"
            - name: SERVER_LIST_PORT
              value: "27015"
            - name: UDP_SOCKET_PORT
              value: "7778"
            - name: DISABLE_BATTLEYE
              value: "true"
            - name: ENABLE_CROSSPLAY
              value: "true"
          volumeMounts:
            - name: ark-data
              mountPath: /app
            - name: ark-backups
              mountPath: /home/steam/ARK-Backups
      volumes:
        - name: ark-data
          persistentVolumeClaim:
            claimName: ark-data-pvc
        - name: ark-backups
          persistentVolumeClaim:
            claimName: ark-backups-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-data-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-backups-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 20Gi
---
# Service UDP (Game, Query, Raw)
apiVersion: v1
kind: Service
metadata:
  name: ark-server-udp
  namespace: games
  annotations:
    metallb.io/load-balancer-ip: 10.0.0.102
    metallb.universe.tf/loadBalancerIP: 10.0.0.102
    metallb.universe.tf/allow-shared-ip: "ark-shared-ip"
spec:
  type: LoadBalancer
  selector:
    app: ark-server
  ports:
    - name: game
      port: 7777
      targetPort: 7777
      protocol: UDP
    - name: raw-udp
      port: 7778
      targetPort: 7778
      protocol: UDP
    - name: server-list
      port: 27015
      targetPort: 27015
      protocol: UDP
---
# Service TCP (RCON)
apiVersion: v1
kind: Service
metadata:
  name: ark-server-tcp
  namespace: games
  annotations:
    metallb.io/load-balancer-ip: 10.0.0.102
    metallb.universe.tf/loadBalancerIP: 10.0.0.102
    metallb.universe.tf/allow-shared-ip: "ark-shared-ip"
spec:
  type: LoadBalancer
  selector:
    app: ark-server
  ports:
    - name: rcon
      port: 27020
      targetPort: 27020
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-filebrowser
  namespace: games
  labels:
    app: ark-filebrowser
    sablier.enable: "true"
    sablier.group: "arkconf.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-filebrowser
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ark-filebrowser
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "chown -R 1000:1000 /database"]
          volumeMounts:
            - name: config
              mountPath: /database
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args:
            - --database
            - /database/filebrowser.db
            - --root
            - /srv
            - --noauth
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: ark-data
              mountPath: /srv
            - name: config
              mountPath: /database
      volumes:
        - name: ark-data
          persistentVolumeClaim:
            claimName: ark-data-pvc
        - name: config
          persistentVolumeClaim:
            claimName: ark-filebrowser-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-filebrowser-config
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ark-filebrowser
  namespace: games
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: ark-filebrowser
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ark-filebrowser
  namespace: games
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: tools-sablier-ark-files@kubernetescrd,security-tinyauth-protect@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - arkconf.valab.top
      secretName: ark-filebrowser-tls
  rules:
    - host: arkconf.valab.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ark-filebrowser
                port:
                  number: 80
