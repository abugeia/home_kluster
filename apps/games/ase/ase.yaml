apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-server
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-server
  template:
    metadata:
      labels:
        app: ark-server
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command:
            - "sh"
            - "-c"
            - |
              if [ "$(stat -c %u /app)" != "1000" ]; then 
                echo 'Fixing permissions...'
                chown -R 1000:1000 /app
                chmod -R 755 /app
              fi
              
              echo 'Synchronizing Goldberg Emulator (480) for cracked server...'
              # Emplacement cible des binaires
              BIN_DIR="/app/server/ShooterGame/Binaries/Linux"
              
              # Sécurité : S'assurer que le dossier de fix appartient à l'utilisateur steam
              [ -d "/app/goldberg_fix" ] && chown -R 1000:1000 /app/goldberg_fix

              # Configuration Goldberg v2 (API + Interfaces + AppID)
              if [ -f "/app/goldberg_fix/libsteam_api.so" ]; then
                echo "Injecting Goldberg API..."
                cp "/app/goldberg_fix/libsteam_api.so" "$BIN_DIR/libsteam_api.so"
                
                # Préparation du dossier de configuration
                mkdir -p "$BIN_DIR/steam_settings"

                # Injection du dictionnaire d'interfaces (LE FIX DU CRASH)
                if [ -f "/app/goldberg_fix/steam_interfaces.txt" ]; then
                  echo "Injecting steam_interfaces.txt dictionary..."
                  cp "/app/goldberg_fix/steam_interfaces.txt" "$BIN_DIR/steam_settings/steam_interfaces.txt"
                fi
                
                # Injection optionnelle du client émulé
                if [ -f "/app/goldberg_fix/steamclient.so" ]; then
                  echo "Injecting steamclient.so..."
                  cp "/app/goldberg_fix/steamclient.so" "$BIN_DIR/libsteamclient.so"
                fi

                # Configuration de l'AppID (Spacewar 480)
                echo '480' > "$BIN_DIR/steam_settings/steam_appid.txt"
                echo '480' > "$BIN_DIR/steam_appid.txt"
                
                CONF_FILE="$BIN_DIR/steam_settings/configs.main.ini"
                if [ ! -f "$CONF_FILE" ]; then
                  echo '[main::general]' > "$CONF_FILE"
                  echo 'app_id=480' >> "$CONF_FILE"
                else
                  grep -q "app_id=" "$CONF_FILE" && sed -i 's/app_id=.*/app_id=480/' "$CONF_FILE" || echo 'app_id=480' >> "$CONF_FILE"
                fi
                
                # Application finale des permissions pour tout le bloc Goldberg
                chown -R 1000:1000 "$BIN_DIR/steam_settings"
                chown 1000:1000 "$BIN_DIR/libsteam_api.so" "$BIN_DIR/libsteamclient.so" "$BIN_DIR/steam_appid.txt" 2>/dev/null || true
                chmod 755 "$BIN_DIR/libsteam_api.so" "$BIN_DIR/libsteamclient.so" 2>/dev/null || true
              else
                echo "WARNING: /app/goldberg_fix/libsteam_api.so NOT FOUND. Using default binary."
              fi

              
              # Patch des configs arkmanager
              for cfg in /etc/arkmanager/arkmanager.cfg /app/arkmanager.cfg; do
                if [ -f "$cfg" ]; then
                  sed -i 's/steamappid=.*/steamappid=480/' "$cfg"
                  chown 1000:1000 "$cfg"
                fi
              done
              
              echo 'Goldberg synchronization complete (AppID 480).'
          volumeMounts:
            - name: ark-data
              mountPath: /app
      containers:
        - name: ark-server
          image: hermsi/ark-server:latest
          args: []
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          resources:
            requests:
              memory: "8Gi"
              cpu: "1000m"
            limits:
              memory: "12Gi"
              cpu: "2000m"
          ports:
            - containerPort: 7777
              protocol: UDP
            - containerPort: 7778
              protocol: UDP
            - containerPort: 27015
              protocol: UDP
            - containerPort: 27020
              protocol: TCP
          env:
            - name: SESSION_NAME
              value: "ARK_NC"
            - name: SERVER_MAP
              value: "Fjordur"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-secrets
                  key: ADMIN_PASSWORD
            # - name: ARK_ADMIN_PASSWORD # Ajout du prefixe pour compatibilité arkmanager
            #   valueFrom:
            #     secretKeyRef:
            #       name: ark-secrets
            #       key: ADMIN_PASSWORD
            - name: SERVER_PASSWORD
              value: ""
            - name: MAX_PLAYERS
              value: "20"
            - name: UPDATE_ON_START
              # Désactivé pour éviter que SteamCMD n'écrase l'émulateur Goldberg (GSE)
              value: "false"
            - name: BACKUP_ON_STOP
              value: "true"
            - name: GAME_CLIENT_PORT
              value: "7777"
            - name: SERVER_LIST_PORT
              value: "27015"
            - name: UDP_SOCKET_PORT
              value: "7778"
            - name: DISABLE_BATTLEYE
              value: "true"
            # - name: ENABLE_CROSSPLAY
            #   value: "true"
          volumeMounts:
            - name: ark-data
              mountPath: /app
            - name: ark-backups
              mountPath: /home/steam/ARK-Backups
      volumes:
        - name: ark-data
          persistentVolumeClaim:
            claimName: ark-data-pvc
        - name: ark-backups
          persistentVolumeClaim:
            claimName: ark-backups-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-data-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-backups-pvc
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 20Gi
---
# Service UDP (Game, Query, Raw)
apiVersion: v1
kind: Service
metadata:
  name: ark-server-udp
  namespace: games
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.102
    metallb.io/allow-shared-ip: "ark-shared-ip"
spec:
  type: LoadBalancer
  # Local: Préserve l'IP source du client (10.0.0.11), souvent requis pour le handshake UDP Ark
  externalTrafficPolicy: Local
  selector:
    app: ark-server
  ports:
    - name: game
      port: 7777
      targetPort: 7777
      protocol: UDP
    - name: raw-udp
      port: 7778
      targetPort: 7778
      protocol: UDP
    - name: server-list
      port: 27015
      targetPort: 27015
      protocol: UDP
---
# Service TCP (RCON)
apiVersion: v1
kind: Service
metadata:
  name: ark-server-tcp
  namespace: games
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.102
    metallb.io/allow-shared-ip: "ark-shared-ip"
spec:
  type: LoadBalancer
  # DOIT ETRE LOCAL POUR PARTAGER L'IP AVEC L'UDP (MetalLB sharing key)
  externalTrafficPolicy: Local
  selector:
    app: ark-server
  ports:
    - name: rcon
      port: 27020
      targetPort: 27020
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-filebrowser
  namespace: games
  labels:
    app: ark-filebrowser
    sablier.enable: "true"
    sablier.group: "arkconf.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-filebrowser
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ark-filebrowser
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "chown -R 1000:1000 /database"]
          volumeMounts:
            - name: config
              mountPath: /database
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args:
            - --database
            - /database/filebrowser.db
            - --root
            - /srv
            - --noauth
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: ark-data
              mountPath: /srv
            - name: config
              mountPath: /database
      volumes:
        - name: ark-data
          persistentVolumeClaim:
            claimName: ark-data-pvc
        - name: config
          persistentVolumeClaim:
            claimName: ark-filebrowser-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-filebrowser-config
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ark-filebrowser
  namespace: games
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: ark-filebrowser
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ark-filebrowser
  namespace: games
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: tools-sablier-ark-files@kubernetescrd,security-tinyauth-protect@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - arkconf.valab.top
      secretName: ark-filebrowser-tls
  rules:
    - host: arkconf.valab.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ark-filebrowser
                port:
                  number: 80
