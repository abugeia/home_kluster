apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonlight-web
  namespace: games
  labels:
    app: moonlight-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moonlight-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: moonlight-web
    spec:
      securityContext:
        # L'image tourne sous l'utilisateur `moonlight` (UID/GID 999).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: moonlight-web
          # v3 (2026-11) : endpoint WebSocket déplacé sous /api/host/stream/web_socket
          # (nos Ingress routent tout `/`, rien à changer) ; config.json et
          # data.json de la v2.10 relus tels quels, appairage Sunshine conservé.
          # Retour possible en v2.10.0 en changeant seulement le tag.
          image: mrcreativ3001/moonlight-web-stream:v3.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Pacific/Noumea"
            - name: BIND_ADDRESS
              value: "0.0.0.0:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # config.json (réglages) et data.json (users, hosts appairés).
            - name: server
              mountPath: /moonlight-web/server
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "2000m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: moonlight-web-server
