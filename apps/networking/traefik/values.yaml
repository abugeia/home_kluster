# Configuration officielle du chart Traefik (Simplifiée via cert-manager)
# Référence: https://github.com/traefik/traefik-helm-chart

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
  priorityClassName: "system-cluster-critical"

tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

providers:
  kubernetesCRD:
    enabled: true
    # Permet de référencer des Middlewares situés dans d'autres namespaces (ex: security, tools)
    allowCrossNamespace: true
  kubernetesIngress:
    publishedService:
      enabled: true
    allowEmptyServices: true

logs:
  access:
    enabled: true

# PERSISTANCE : Activée sur /plugins-storage pour stabiliser les plugins (Sablier).
# Évite que les plugins ne soient re-téléchargés (et potentiellement perdus) à chaque redémarrage.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  path: /plugins-storage

ports:
  web:
    forwardedHeaders:
      insecure: true
  websecure:
    tls:
      enabled: true
    forwardedHeaders:
      insecure: true

service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    metallb.io/load-balancer-ip: 10.0.0.101

experimental:
  plugins:
    sablier:
      moduleName: "github.com/sablierapp/sablier"
      version: "v1.10.1"
