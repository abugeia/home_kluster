# Configuration officielle du chart Traefik (Simplifiée via cert-manager)
# Référence: https://github.com/traefik/traefik-helm-chart

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
  priorityClassName: "system-cluster-critical"
  # Sources du plugin Sablier stockées sur un PVC persistant (cf. extraObjects).
  additionalVolumes:
    - name: plugins-local
      persistentVolumeClaim:
        claimName: traefik-plugins
  # Clone les sources du plugin Sablier UNE seule fois, puis le PVC les conserve.
  # Objectif : supprimer toute dépendance réseau au démarrage de Traefik.
  # Historique : en mode plugin distant, Traefik retéléchargeait le plugin depuis
  # plugins.traefik.io à chaque boot. Au reboot nocturne, le réseau du pod (CNI/DNS)
  # n'est pas prêt -> téléchargement KO -> "Plugins are disabled" -> tous les
  # middlewares tools-sablier-* invalides -> 404 sur les apps + Sablier jamais
  # sollicité (donc aucun réveil). Le mode localPlugins lit les sources sur disque.
  # L'initContainer n'échoue JAMAIS le boot : si le réseau est indisponible mais que
  # les sources sont déjà présentes sur le PVC, Traefik démarre quand même.
  initContainers:
    - name: fetch-sablier-plugin
      image: alpine/git:2.47.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          DEST="/plugins-local/src/github.com/sablierapp/sablier-traefik-plugin"
          if [ -f "$DEST/.traefik.yml" ]; then
            echo "Plugin Sablier deja present -> skip clone"
          else
            echo "Clone du plugin Sablier ${SABLIER_PLUGIN_VERSION}..."
            rm -rf "$DEST"
            mkdir -p "$DEST"
            git clone --depth 1 --branch "${SABLIER_PLUGIN_VERSION}" \
              https://github.com/sablierapp/sablier-traefik-plugin "$DEST" \
              || echo "AVERTISSEMENT: clone echoue (reseau indispo au boot). Traefik demarrera avec les sources existantes si presentes."
          fi
          exit 0
      env:
        - name: SABLIER_PLUGIN_VERSION
          value: "v1.3.0"
        - name: HOME
          value: /plugins-local
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      volumeMounts:
        - name: plugins-local
          mountPath: /plugins-local

# fsGroup : indispensable pour que l'initContainer non-root (uid 65532) puisse
# écrire dans le PVC traefik-plugins fraîchement provisionné (sinon root:root).
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

providers:
  kubernetesCRD:
    enabled: true
    # Permet de référencer des Middlewares situés dans d'autres namespaces (ex: security, tools)
    allowCrossNamespace: true
  kubernetesIngress:
    publishedService:
      enabled: true
    allowEmptyServices: true

logs:
  access:
    enabled: true

# PVC dédié aux SOURCES du plugin Sablier (mode localPlugins).
# Provisionné une fois, conservé ensuite (survit aux reboots) : aucun
# téléchargement réseau requis au démarrage de Traefik.
extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: traefik-plugins
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

ports:
  web:
    forwardedHeaders:
      insecure: true
  websecure:
    tls:
      enabled: true
    forwardedHeaders:
      insecure: true

service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    metallb.io/load-balancer-ip: 10.0.0.101

experimental:
  # Plugin Sablier en mode LOCAL (sources sur PVC, cf. deployment.initContainers).
  # Remplace l'ancien plugin distant (experimental.plugins.sablier) dont le
  # re-téléchargement au boot provoquait les 404 après le redémarrage nocturne.
  # Le plugin a été extrait dans un repo dédié fin 2025 ; v1.3.0 : fix cache page
  # d'attente/redirect loop (#37), fix SSE hang (#36), keep-alive (#35), failOpen (#40).
  localPlugins:
    sablier:
      type: localPath
      moduleName: github.com/sablierapp/sablier-traefik-plugin
      mountPath: /plugins-local
      volumeName: plugins-local
