# Configuration officielle du chart Traefik (Simplifiée via cert-manager)
# Référence: https://github.com/traefik/traefik-helm-chart

# strictTLSOptions : désactive le repli silencieux sur les TLSOptions par défaut
# en cas de conflit entre routers servant le même hostname (GHSA-g55h-rg46-x9c5,
# CVSS 8.2). Le correctif est opt-in : `false` par défaut MÊME sur une version
# patchée, il faut donc l'activer explicitement. Requiert traefik v3.7.11+.
core:
  strictTLSOptions: true

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
  # Sources du plugin Sablier stockées sur un PVC persistant (cf. extraObjects).
  additionalVolumes:
    - name: plugins-local
      persistentVolumeClaim:
        claimName: traefik-plugins
  # Clone les sources du plugin Sablier UNE seule fois, puis le PVC les conserve.
  # Objectif : supprimer toute dépendance réseau au démarrage de Traefik.
  # Historique : en mode plugin distant, Traefik retéléchargeait le plugin depuis
  # plugins.traefik.io à chaque boot. Au reboot nocturne, le réseau du pod (CNI/DNS)
  # n'est pas prêt -> téléchargement KO -> "Plugins are disabled" -> tous les
  # middlewares tools-sablier-* invalides -> 404 sur les apps + Sablier jamais
  # sollicité (donc aucun réveil). Le mode localPlugins lit les sources sur disque.
  # L'initContainer n'échoue JAMAIS le boot : si le réseau est indisponible mais que
  # les sources sont déjà présentes sur le PVC, Traefik démarre quand même.
  initContainers:
    - name: fetch-sablier-plugin
      image: alpine/git:2.47.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          DEST="/plugins-local/src/github.com/sablierapp/sablier-traefik-plugin"
          if [ -f "$DEST/.traefik.yml" ]; then
            echo "Plugin Sablier deja present -> skip clone"
          else
            echo "Clone du plugin Sablier ${SABLIER_PLUGIN_VERSION}..."
            rm -rf "$DEST"
            mkdir -p "$DEST"
            git clone --depth 1 --branch "${SABLIER_PLUGIN_VERSION}" \
              https://github.com/sablierapp/sablier-traefik-plugin "$DEST" \
              || echo "AVERTISSEMENT: clone echoue (reseau indispo au boot). Traefik demarrera avec les sources existantes si presentes."
          fi
          exit 0
      env:
        - name: SABLIER_PLUGIN_VERSION
          value: "v1.3.0"
        - name: HOME
          value: /plugins-local
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      volumeMounts:
        - name: plugins-local
          mountPath: /plugins-local

# priorityClassName est une clé RACINE du chart (et non `deployment.*`, où elle
# était placée jusqu'ici : acceptée par le schéma mais jamais appliquée, donc
# Traefik tournait sans priorité garantie face à l'éviction).
priorityClassName: "system-cluster-critical"

# fsGroup : indispensable pour que l'initContainer non-root (uid 65532) puisse
# écrire dans le PVC traefik-plugins fraîchement provisionné (sinon root:root).
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

providers:
  # Provider Gateway API : lit les Gateway / HTTPRoute (CRDs v1.4.0, fournies par
  # l'Application `gateway-api-crds` depuis que le chart a cessé de les livrer).
  # Cohabite avec kubernetesCRD et kubernetesIngress : les Ingress existants
  # continuent d'être servis, seul whoami passe par un HTTPRoute (pilote).
  kubernetesGateway:
    enabled: true

  kubernetesCRD:
    enabled: true
    # Permet de référencer des Middlewares situés dans d'autres namespaces (ex: security, tools)
    allowCrossNamespace: true
  kubernetesIngress:
    publishedService:
      enabled: true
    allowEmptyServices: true

# Renommé depuis `logs.access` : le chart v41 aligne ses clés sur la syntaxe
# upstream (`logs.general` -> `log`, `logs.access` -> `accessLog`). La racine du
# schéma étant désormais stricte, l'ancien nom ferait échouer le rendu Helm.
accessLog:
  enabled: true

# Gateway déployé par le chart (nom par défaut `traefik-gateway`, dans le namespace
# du release donc kube-system ; gatewayClassName `traefik`).
#
# Les ports doivent correspondre à ceux déclarés dans `ports` (le template échoue
# sinon) : ce sont les ports INTERNES du conteneur, 8000/8443, et non 80/443.
#
# namespacePolicy -> allowedRoutes.namespaces. Sans lui, un Gateway n'accepte que
# les routes de SON namespace (défaut `Same`) et le HTTPRoute de whoami serait
# rejeté. `All` est l'équivalent, côté Gateway API, du `allowCrossNamespace=true`
# déjà en place pour le provider kubernetesCRD.
#
# Le listener HTTPS exige certificateRefs (le template échoue sans) : cert-manager
# tournant sans --enable-gateway-api, il ignorerait une annotation sur le Gateway.
# On fabrique donc le certificat via un objet Certificate explicite (extraObjects).
# Le secret doit vivre dans le namespace du Gateway, sinon il faudrait un
# ReferenceGrant.
gateway:
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      certificateRefs:
        - name: gateway-valab-tls
      namespacePolicy:
        from: All

# PVC dédié aux SOURCES du plugin Sablier (mode localPlugins).
# Provisionné une fois, conservé ensuite (survit aux reboots) : aucun
# téléchargement réseau requis au démarrage de Traefik.
extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: traefik-plugins
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  # Certificat du listener websecure du Gateway. Émis explicitement (et non via
  # l'annotation cert-manager.io/cluster-issuer, qu'un Gateway ne déclenche pas
  # tant que cert-manager tourne sans --enable-gateway-api). Rendu dans le
  # namespace du release (kube-system), là où le Gateway peut le référencer sans
  # ReferenceGrant.
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: gateway-valab-tls
    spec:
      secretName: gateway-valab-tls
      issuerRef:
        name: letsencrypt
        kind: ClusterIssuer
      dnsNames:
        - whoami.valab.top

ports:
  web:
    forwardedHeaders:
      insecure: true
  websecure:
    # `tls` est passé sous le niveau `http` avec le chart v39 (les options HTTP
    # d'un entrypoint y sont désormais imbriquées). L'ancien emplacement est
    # rejeté par le schéma. La valeur reste explicite bien qu'elle soit le défaut.
    http:
      tls:
        enabled: true
    forwardedHeaders:
      insecure: true

service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    metallb.io/load-balancer-ip: 10.0.0.101

experimental:
  # Plugin Sablier en mode LOCAL (sources sur PVC, cf. deployment.initContainers).
  # Remplace l'ancien plugin distant (experimental.plugins.sablier) dont le
  # re-téléchargement au boot provoquait les 404 après le redémarrage nocturne.
  # Le plugin a été extrait dans un repo dédié fin 2025 ; v1.3.0 : fix cache page
  # d'attente/redirect loop (#37), fix SSE hang (#36), keep-alive (#35), failOpen (#40).
  localPlugins:
    sablier:
      type: localPath
      moduleName: github.com/sablierapp/sablier-traefik-plugin
      mountPath: /plugins-local
      volumeName: plugins-local
