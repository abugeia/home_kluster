# Values for the MetalLB chart (version pinned in argocd/apps/metallb.yaml)
# Custom L2 configuration is handled separately in conf/metallb.yaml

# L2 uniquement : pas besoin du backend BGP frr-k8s (activé par défaut depuis le
# chart 0.16). Son statuscleaner (hostNetwork + hostPort, sans updateStrategy
# configurable) bloque chaque rollout sur notre cluster mono-nœud.
frrk8s:
  enabled: false

prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    # namespace: observability # Si Prometheus est là

controller:
  logLevel: info
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

speaker:
  logLevel: info
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  frr:
    enabled: false
  # Permet au speaker d'envoyer des ARP même si Cilium est là
  # (Cilium peut bloquer les ARP non autorisés)
  # Mais ici on part du principe que Cilium ne fait pas d'annonces L2.
