remoteWrite:
  - url: "http://10.0.0.13:8428/api/v1/write"
config:
  global:
    scrape_interval: 15s
  scrape_configs:
    # 1. Scrape automatique des Pods annotés avec prometheus.io/scrape: "true"
    # Cela inclura automatiquement Traefik, cert-manager, etc.
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        # Filtre pour éviter les doublons si le pod a plusieurs ports
        # On ne garde que la cible dont le numéro de port correspond à l'annotation
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
          action: keep_if_equal

    # 2. Scrape des noeuds Kubernetes (Kubelet / cAdvisor / Node Exporter si installé)
    # Scrape DIRECT du kubelet : `role: node` pose déjà __address__ à
    # <NodeInternalIP>:<port kubelet> (10250), on ne réécrit donc rien.
    # Ne PAS repasser par le proxy de l'API server (/api/v1/nodes/$1/proxy/...) :
    # ça exige la permission `nodes/proxy`, que le chart a retirée de son
    # ClusterRole en 0.31.0 (escalade de privilèges). L'accès direct relève de
    # `nodes/metrics`, toujours accordé — cf. la table d'autorisation kubelet.
    - job_name: 'kubernetes-nodes'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        # Le certificat du kubelet est auto-signé, pas émis par le CA du cluster
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      metrics_path: /metrics
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # 3. Scrape cAdvisor (Container metrics - CPU/RAM des pods)
    # Même bascule que le job 2 : kubelet en direct sur :10250.
    - job_name: 'kubernetes-cadvisor'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      metrics_path: /metrics/cadvisor
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # 4. Scrape des hôtes externes (Proxmox + LXC)
    # 10.0.0.15 = VM ai-gaming (UP intermittente, GPU passthrough). Quand DOWN,
    # up=0 — c'est attendu, signal exploitable en dashboard.
    # 10.0.0.19 = VM dev (819, always-on) : métriques continues attendues.
    - job_name: 'external-nodes'
      static_configs:
        - targets: ['10.0.0.10:9100', '10.0.0.11:9100', '10.0.0.12:9100', '10.0.0.13:9100', '10.0.0.14:9100', '10.0.0.15:9100', '10.0.0.19:9100']
          labels:
            env: 'prod'

    # 4b. Scrape nvidia_gpu_exporter (utkuozdemir) sur la VM Windows gaming.
    # Source séparée du Linux textfile collector (intégré au :9100 via
    # node_exporter). UP intermittent comme ai-gaming.
    - job_name: 'gpu-windows'
      static_configs:
        - targets: ['10.0.0.18:9835']
          labels:
            env: 'prod'
            host: 'windows-gaming'

    # 5. Scrape applicatif Garage
    - job_name: 'garage'
      static_configs:
        - targets: ['10.0.0.14:3903']

    # 6. Scrape applicatif Postgres
    - job_name: 'postgres'
      static_configs:
        - targets: ['10.0.0.12:9187']

    # 7. Scrape de l'onduleur Proxmox (NUT)
    - job_name: 'nut'
      metrics_path: /ups_metrics
      static_configs:
        - targets: ['10.0.0.10:9110']
# vmagent est extrêmement léger
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
