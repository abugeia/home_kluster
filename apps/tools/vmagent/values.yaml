remoteWrite:
  - url: "http://10.0.0.13:8428/api/v1/write"
config:
  global:
    scrape_interval: 15s
  scrape_configs:
    # 1. Scrape automatique des Pods annotés avec prometheus.io/scrape: "true"
    # Cela inclura automatiquement Traefik, cert-manager, etc.
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        # Filtre pour éviter les doublons si le pod a plusieurs ports
        # On ne garde que la cible dont le numéro de port correspond à l'annotation
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
          action: keep_if_equal

    # 2. Scrape des noeuds Kubernetes (Kubelet / cAdvisor / Node Exporter si installé)
    - job_name: 'kubernetes-nodes'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/$1/proxy/metrics

    # 3. Scrape cAdvisor (Container metrics - CPU/RAM des pods)
    - job_name: 'kubernetes-cadvisor'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

    # 4. Scrape des hôtes externes (Proxmox + LXC)
    - job_name: 'external-nodes'
      static_configs:
        - targets: ['10.0.0.10:9100', '10.0.0.11:9100', '10.0.0.12:9100', '10.0.0.13:9100', '10.0.0.14:9100']
          labels:
            env: 'prod'

    # 5. Scrape applicatif Garage
    - job_name: 'garage'
      static_configs:
        - targets: ['10.0.0.14:3903']

    # 6. Scrape applicatif Postgres
    - job_name: 'postgres'
      static_configs:
        - targets: ['10.0.0.12:9187']

    # 7. Scrape de l'onduleur Proxmox (NUT)
    - job_name: 'nut'
      static_configs:
        - targets: ['10.0.0.10:9110']
# vmagent est extrêmement léger
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
