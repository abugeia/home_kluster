apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webtop-config
  namespace: tools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop
  namespace: tools
  labels:
    app: webtop
    sablier.enable: "true"
    sablier.group: "web.valab.top"
spec:
  selector:
    matchLabels:
      app: webtop
  template:
    metadata:
      labels:
        app: webtop
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          volumeMounts:
            - name: config
              mountPath: /config
        - name: cleanup-chrome-locks
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - find /config -name 'SingletonLock' -o -name 'SingletonSocket' -o -name 'SingletonCookie' | xargs -r rm -f
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: webtop
          # Webtop n'a pas de versioning sémantique : le tag choisit la saveur
          # (distro + bureau), ici ubuntu-kde. On fige donc la saveur + le digest
          # courant pour l'immutabilité ; Renovate suit les mises à jour de digest.
          image: lscr.io/linuxserver/webtop:ubuntu-kde@sha256:22a6eb6e798abbbac3faed236dfb140b1451051b59fc58fd21eea097d1497ab9
          imagePullPolicy: IfNotPresent
          tty: true
          stdin: true
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Pacific/Noumea"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            privileged: true # Often needed for webtop hardware acceleration/compatibility
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: webtop-config
        - name: dshm
          emptyDir:
            medium: Memory
