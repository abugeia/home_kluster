apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webtop-config
  namespace: tools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop
  namespace: tools
  labels:
    app: webtop
    sablier.enable: "true"
    sablier.group: "webtop"
spec:
  selector:
    matchLabels:
      app: webtop
  template:
    metadata:
      labels:
        app: webtop
    spec:
      containers:
        - name: webtop
          image: lscr.io/linuxserver/webtop:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Pacific/Noumea"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          securityContext:
            privileged: true # Often needed for webtop hardware acceleration/compatibility
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: webtop-config
