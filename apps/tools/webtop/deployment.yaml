# Ancien profil (ubuntu-kde, hérité d'arch/alpine) : plus monté, gardé le temps
# de récupérer ce qui sert. Laissé déclaré + Prune=false car la SC nfs-csi-nvme
# est en reclaimPolicy Delete : le retirer du dépôt détruirait les données.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webtop-config
  namespace: tools
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 10Gi
---
# Profil vierge pour debian-xfce : l'ancien mélangeait des profils chromium/KDE
# de plusieurs distros, cause probable du navigateur qui ne démarre plus.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webtop-config-v2
  namespace: tools
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop
  namespace: tools
  labels:
    app: webtop
    sablier.enable: "true"
    sablier.group: "web.valab.top"
spec:
  selector:
    matchLabels:
      app: webtop
  template:
    metadata:
      labels:
        app: webtop
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          volumeMounts:
            - name: config
              mountPath: /config
        - name: cleanup-chrome-locks
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - find /config -name 'SingletonLock' -o -name 'SingletonSocket' -o -name 'SingletonCookie' | xargs -r rm -f
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: webtop
          # Webtop n'a pas de versioning sémantique : le tag choisit la saveur
          # (distro + bureau), ici debian-xfce : X11 natif (Xvfb), sans le mode
          # Wayland d'ubuntu-kde (kwin sans GPU, crash startwm à la reconnexion),
          # avec chromium. On fige la saveur + le digest courant pour
          # l'immutabilité ; Renovate suit les mises à jour de digest.
          image: lscr.io/linuxserver/webtop:debian-xfce@sha256:dd8218828958988f88b3e0d9ddd97a6337189662eeca57bfa49d78688f5a3695
          imagePullPolicy: IfNotPresent
          tty: true
          stdin: true
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Pacific/Noumea"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            privileged: true # Often needed for webtop hardware acceleration/compatibility
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: webtop-config-v2
        - name: dshm
          emptyDir:
            medium: Memory
            # Équivalent du --shm-size=1gb recommandé par linuxserver.
            sizeLimit: 1Gi
