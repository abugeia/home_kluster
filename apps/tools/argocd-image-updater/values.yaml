config:
  log.level: "info"
  # Identité des commits de write-back dans le repo GitOps
  git.user: "argocd-image-updater"
  git.email: "argocd-image-updater@home_kluster"
  # Registries surveillés. Harbor prod est privé : on réutilise le pull secret
  # harbor-cicd-secret (présent dans le ns argocd).
  registries:
    - name: Harbor Valab
      api_url: https://harbor.valab.top
      prefix: harbor.valab.top
      ping: yes
      credentials: pullsecret:argocd/harbor-cicd-secret
      default: true

# Modèle CRD (chart 1.x) : la config de suivi vit dans une ressource ImageUpdater,
# pas dans les annotations de l'Application. Déployée via extraObjects.
extraObjects:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: vfnc
    spec:
      # tag :main mutable -> on suit le digest (sha256) derrière main
      commonUpdateSettings:
        updateStrategy: digest
      # write-back GitOps via la deploy key SSH (SealedSecret image-updater-git-creds)
      writeBackConfig:
        method: "git:secret:argocd/image-updater-git-creds"
        gitConfig:
          repository: git@github.com:abugeia/home_kluster.git
          branch: main
      # cible : l'Application argocd "vfnc" (même namespace que cette CR : argocd)
      applicationRefs:
        - namePattern: vfnc
          images:
            - alias: api
              imageName: harbor.valab.top/prod/vfnc-api:main
            - alias: web
              imageName: harbor.valab.top/prod/vfnc-web:main
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: droit-compare
    spec:
      # tag :main mutable -> on suit le digest (sha256) derrière main
      commonUpdateSettings:
        updateStrategy: digest
      # write-back GitOps via la deploy key SSH (SealedSecret image-updater-git-creds)
      writeBackConfig:
        method: "git:secret:argocd/image-updater-git-creds"
        gitConfig:
          repository: git@github.com:abugeia/home_kluster.git
          branch: main
      # cible : l'Application argocd "droit-compare" (même namespace que cette CR : argocd)
      applicationRefs:
        - namePattern: droit-compare
          images:
            - alias: app
              imageName: harbor.valab.top/prod/droit-compare:main
            - alias: ocr
              imageName: harbor.valab.top/prod/droit-compare-ocr:main
