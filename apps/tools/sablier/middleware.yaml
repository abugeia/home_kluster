apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablier-30m
  namespace: tools
spec:
  plugin:
    sablier:
      sablierUrl: http://sablier-sablier.tools.svc.cluster.local:10000
      # Utilise le label 'sablier.group' du Pod de destination pour identifier le groupe Sablier
      group: '{{ index .Labels "sablier.group" }}'
      sessionDuration: 30m
      dynamic:
        displayName: '{{ index .Labels "sablier.group" }}'
        showDetails: true
        theme: ghost
        refreshFrequency: 2s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablier-1h
  namespace: tools
spec:
  plugin:
    sablier:
      sablierUrl: http://sablier-sablier.tools.svc.cluster.local:10000
      group: '{{ index .Labels "sablier.group" }}'
      sessionDuration: 1h
      dynamic:
        displayName: '{{ index .Labels "sablier.group" }}'
        showDetails: true
        theme: ghost
        refreshFrequency: 2s
