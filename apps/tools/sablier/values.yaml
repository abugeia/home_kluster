# Configuration Sablier pour Scale-to-Zero
# Documentation: https://sablierapp.dev
#
# NOTE (chart 1.2.x) : la structure des values a été refondue par rapport à la 1.0.x.
# - Le provider Kubernetes est désormais hardcodé dans le template (args: start --provider.name=kubernetes).
# - Le RBAC (ServiceAccount + Role) est créé automatiquement par le chart.
# - La configuration fine passe par `extraArgs` (flags CLI du serveur Sablier).

# Niveau de log (mappé sur --logging.level)
logLevel: "info"

image:
  # Épinglé sur l'appVersion du chart 1.2.1 ; explicite pour tracer la version serveur.
  tag: "1.13.0"

# Arguments CLI additionnels passés au conteneur sablier.
extraArgs:
  # Intervalle de vérification d'expiration des sessions.
  - --sessions.expiration-interval=3m
  # Expose l'endpoint Prometheus /metrics (anciennement metrics.enabled: true).
  - --server.metrics.enabled=true
