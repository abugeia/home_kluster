# Configuration Grafana pour home_kluster
# Documentation: https://github.com/grafana/helm-charts/tree/main/charts/grafana

# Persistence pour conserver dashboards et config
persistence:
  enabled: true
  size: 1Gi
  storageClassName: nfs-csi-nvme

# Ressources adaptées à un home lab
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Correction des permissions pour NFS
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472

securityContext:
  fsGroup: 472

initChownData:
  enabled: true

# Ingress pour accès via Traefik
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Homepage dashboard annotations
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Metrics Visualization"
    gethomepage.dev/group: "Admin"
    gethomepage.dev/icon: "si-grafana"
    gethomepage.dev/href: "https://grafana.valab.top"
  hosts:
    - grafana.valab.top
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.valab.top

# Datasource VictoriaMetrics (compatible Prometheus)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://10.0.0.13:8428
        access: proxy
        isDefault: true
        editable: false

# Configuration du backend database
grafana.ini:
  database:
    type: postgres
    host: 10.0.0.12:5432
    name: grafana_db
    user: grafana
    password: $__env{password}
    ssl_mode: disable

  server:
    domain: grafana.valab.top
    root_url: "https://grafana.valab.top"
  users:
    allow_sign_up: false
  # Auth OIDC avec Pocket ID
  auth.generic_oauth:
    enabled: true
    name: "Pocket ID"
    allow_sign_up: true
    auto_login: false
    client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    scopes: openid profile email groups
    auth_url: https://auth-id.valab.top/authorize
    token_url: https://auth-id.valab.top/api/oidc/token
    api_url: https://auth-id.valab.top/api/oidc/userinfo
    # Mapper les attributs OIDC
    role_attribute_path: contains(groups[*], 'admin') && 'Admin' || 'Viewer'

# Sidecar dashboards : watch les ConfigMaps avec label grafana_dashboard=1
# et les charge auto dans Grafana. Workflow GitOps : un dashboard JSON
# dans le repo → ConfigMap généré via kustomize → sidecar le découvre.
# Pattern documenté côté Ansible (cf. infra_proxmox), géré ici via
# l'Application ArgoCD `grafana-dashboards` qui pointe
# apps/tools/grafana/dashboards/.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folder: /tmp/dashboards
    provider:
      foldersFromFilesStructure: true

# Secrets OIDC et Postgres injectés globalement
envFromSecrets:
  - name: grafana-oidc-secret
  - name: grafana-pg-secret

# Identifiants admin repris d'un SealedSecret, et NON générés par le chart.
# Sans ça, le helper `grafana.password` retombe sur `randAlphaNum 40` : son
# `lookup` du Secret existant renvoie toujours vide en `helm template`, qui est
# le mode de rendu d'ArgoCD. Résultat, un mot de passe neuf à chaque rendu, donc
# une annotation `checksum/secret` neuve, donc un rollout du pod — 622 révisions
# accumulées avant correction, et un mot de passe admin jamais utilisable.
# Renseigner `admin.existingSecret` neutralise à la fois le rendu du Secret et
# l'annotation checksum (même condition dans les templates du chart).
#
# Le secret vit dans secrets/clear/grafana.yaml (gitignored), aux côtés du secret
# OIDC, scellé vers secrets/sealed/grafana.yaml et déployé par l'App `secret-app`.
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

