# Règles d'alerte Grafana, évaluées sur VictoriaMetrics (datasource
# victoriametrics-alerting). Liste à revoir : chaque règle notifie ntfy.
# noDataState OK : une requête sans série = rien d'anormal, sauf pour le dump
# Postgres, dont la métrique doit toujours exister.
# Pas de `$` dans les annotations : Grafana y substituerait l'environnement.
apiVersion: 1
groups:
- orgId: 1
  name: sauvegardes
  folder: Homelab
  interval: 5m
  rules:
  - uid: postgres-dump-retard
    title: Dump Postgres en retard
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: (time() - postgres_dump_last_success_timestamp_seconds) / 3600
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 36
    noDataState: Alerting
    execErrState: Error
    for: 0s
    annotations:
      summary: Dernier dump Postgres réussi il y a {{ printf "%.0f" (index .Values "A").Value }} h (pve1, /tank_data/backup/postgres).
    labels:
      severity: critical
  - uid: postgres-dump-echec
    title: Dump Postgres en échec
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: postgres_dump_failed
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ printf "%.0f" (index .Values "A").Value }} base(s) en échec au dernier passage de postgres-dump (journalctl -u postgres-dump sur pve1).'
    labels:
      severity: critical
- orgId: 1
  name: stockage
  folder: Homelab
  interval: 1m
  rules:
  - uid: zfs-pool-degrade
    title: Pool ZFS dégradé
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: node_zfs_zpool_state{instance="10.0.0.10:9100", state!="online"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Pool {{ .Labels.zpool }} en état {{ .Labels.state }} sur pve1 (zpool status).
    labels:
      severity: critical
  - uid: disque-plein
    title: Disque presque plein
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nfs.*|fuse.*|ramfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nfs.*|fuse.*|ramfs|devtmpfs"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 20
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: '{{ .Labels.mountpoint }} sur {{ .Labels.instance }} : {{ printf "%.0f" (index .Values "A").Value }} % libres.'
    labels:
      severity: warning
  - uid: pvc-plein
    title: PVC presque plein
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: 100 * kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 10
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: 'PVC {{ .Labels.namespace }}/{{ .Labels.persistentvolumeclaim }} : {{ printf "%.0f" (index .Values "A").Value }} % libres.'
    labels:
      severity: warning
- orgId: 1
  name: kubernetes
  folder: Homelab
  interval: 1m
  rules:
  - uid: pod-crashloop
    title: Pod en CrashLoop
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: '{{ .Labels.namespace }}/{{ .Labels.pod }} (conteneur {{ .Labels.container }}) redémarre en boucle.'
    labels:
      severity: warning
  - uid: deployment-degrade
    title: Deployment dégradé
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: max by (namespace, deployment) (kube_deployment_status_replicas_unavailable)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: '{{ .Labels.namespace }}/{{ .Labels.deployment }} : {{ printf "%.0f" (index .Values "A").Value }} replica(s) indisponible(s).'
    labels:
      severity: warning
  - uid: certificat-expire
    title: Certificat TLS bientôt expiré
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: 'Certificat {{ .Labels.namespace }}/{{ .Labels.name }} : expire dans {{ printf "%.0f" (index .Values "A").Value }} jours, cert-manager ne l''a pas renouvelé (kubectl describe certificate).'
    labels:
      severity: warning
  - uid: job-echec
    title: Job Kubernetes en échec
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        # Fenêtre de 6 h comptée depuis l'ÉCHEC (première apparition de la
        # condition Failed), pas depuis le démarrage : l'ancienne version
        # (time() - kube_job_status_start_time) ne voyait jamais un Job tué
        # par activeDeadlineSeconds >= 6 h (beets-musique, 19/11). La fenêtre
        # évite de renotifier les vieux Jobs gardés par failedJobsHistoryLimit.
        # tfirst_over_time = MetricsQL (VictoriaMetrics).
        expr: >-
          max by (namespace, job_name) (kube_job_failed{condition="true"} == 1)
          and on (namespace, job_name)
          (time() - tfirst_over_time(kube_job_failed{condition="true"}[1d]) < 6 * 3600)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: 'Job {{ .Labels.namespace }}/{{ .Labels.job_name }} en échec (échec il y a moins de 6 h).'
    labels:
      severity: warning
- orgId: 1
  name: infrastructure
  folder: Homelab
  interval: 1m
  rules:
  - uid: onduleur-sur-batterie
    title: Onduleur sur batterie
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: network_ups_tools_ups_status{flag="OB"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: 'Coupure secteur : l''onduleur de pve1 tourne sur batterie.'
    labels:
      severity: critical
  - uid: exporteur-muet
    title: Exporteur de métriques muet
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: up{job!="gpu-windows", instance!~"10\\.0\\.0\\.(15|18):.*"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: '{{ .Labels.job }} / {{ .Labels.instance }} ne répond plus au scrape de vmagent.'
    labels:
      severity: warning
  - uid: postgres-injoignable
    title: Postgres injoignable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: pg_up
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: 'Le Postgres du LXC 112 (10.0.0.12) ne répond plus à postgres-exporter : toutes les apps qui en dépendent sont touchées.'
    labels:
      severity: critical
  - uid: onduleur-batterie-faible
    title: Batterie onduleur faible
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: victoriametrics-alerting
      model:
        refId: A
        expr: network_ups_tools_battery_charge
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 50
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: 'Batterie de l''onduleur de pve1 à {{ printf "%.0f" (index .Values "A").Value }} %.'
    labels:
      severity: critical
