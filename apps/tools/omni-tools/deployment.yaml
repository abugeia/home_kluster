apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-tools
  namespace: tools
  labels:
    app: omni-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-tools
  template:
    metadata:
      labels:
        app: omni-tools
    spec:
      containers:
        - name: omni-tools
          image: iib0011/omni-tools:0.7.0@sha256:85f0e052a97326396c753e39de0ef74631c0783999ccca81ebc36262903ec9fa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: web
