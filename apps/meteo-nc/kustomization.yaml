apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meteo-nc
resources:
  - pvc.yaml
  - cronjob.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Image web surveillée par argocd-image-updater (write-back kustomize, digest du tag :main).
# L'image du job (CronJob) reste en :latest + Always : l'image-updater ne la voit pas.
images:
  - name: harbor.valab.top/prod/meteo-nc-web
    newTag: main
