apiVersion: batch/v1
kind: CronJob
metadata:
  name: meteo-nc-fetch
  namespace: meteo-nc
spec:
  # Le cluster est éteint la nuit (planning du pi0, infra_proxmox : ~07:50/09:00 -> 23:30/minuit).
  # Passage toutes les heures pendant la plage d'allumage ; le job ne fait rien s'il n'y a rien
  # de neuf, et rattrape au démarrage les runs AROME publiés pendant l'extinction (encore en ligne 2-3 j).
  # Open-Meteo n'est rafraîchi que si ses données ont plus de 5 h (quota gratuit).
  schedule: "45 8-23 * * *"
  timeZone: "Pacific/Noumea"
  # Démarrage du cluster après l'heure prévue : le passage manqué est lancé s'il date de moins de 30 min.
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: meteo-nc-fetch
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: harbor-cicd-secret # répliqué par Reflector (label ns replicate-harbor-cicd)
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            # NFS ignore souvent fsGroup : on donne la racine du volume à l'utilisateur du job (non récursif).
            - name: fix-permissions
              image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              securityContext:
                runAsUser: 0
              command: ["sh", "-c", "mkdir -p /data/forecasts /data/archive && chown 1000:1000 /data /data/forecasts /data/archive"]
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: fetch
              # :latest + Always : chaque exécution crée un pod neuf qui re-pull (cf. nc-data-loader).
              image: harbor.valab.top/prod/meteo-nc-job:latest
              imagePullPolicy: Always
              args: ["fetch", "all"]
              env:
                - name: METEONC_DATA_DIR
                  value: /data
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: "250m"
                  memory: "768Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: meteo-nc-data
