apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  # nfs-csi-nvme (et non local-path) : la config doit survivre à un reschedule du pod
  # sur un autre nœud. local-path est lié au disque local du nœud → config perdue.
  storageClassName: nfs-csi-nvme
  resources:
    requests:
      storage: 50Mi
