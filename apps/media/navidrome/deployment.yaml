apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app: navidrome
    sablier.enable: "true"
    sablier.group: "music.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
        - name: navidrome
          image: deluan/navidrome:0.62.0
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_SCANTYPES
              value: "m4a,mp3,flac,ogg"
            # Purge les entrées "missing" lors des scans complets. Pertinent car
            # beets (move:yes) déplace Musique_sync/ -> Musique/ : sans ça, les
            # fichiers déplacés s'accumulent en fantômes dans la base.
            - name: ND_SCANNER_PURGEMISSING
              value: "full"
            # Playlists importées (.nsp/.m3u) et créées par les users = publiques
            # par défaut → visibles par tout le monde (et via Subsonic/Symfonium).
            # Sans ça elles sont privées au compte propriétaire (souvent "admin").
            - name: ND_DEFAULTPLAYLISTPUBLICVISIBILITY
              value: "true"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_BASEURL
              value: ""
            - name: ND_REVERSEPROXYUSERHEADER
              value: "Remote-User"
            - name: ND_REVERSEPROXYWHITELIST
              value: "0.0.0.0/0"
            - name: ND_EXTAUTH_ENABLED
              value: "true"
            - name: ND_EXTAUTH_USERHEADER
              value: "Remote-User"
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: "0.0.0.0/0"
            - name: ND_LOGLEVEL
              value: "info"
          volumeMounts:
            - name: data
              mountPath: /data
            # Navidrome scanne /music = les DEUX sous-dossiers (Musique 74G +
            # Musique_sync), pour pouvoir créer des playlists piochant dans les deux.
            # NB : Musique_sync étant aussi exposé en source locale Symfonium, il
            # apparaîtra en double côté client (stream Navidrome + local) — retirer
            # la source locale si le doublon gêne.
            - name: music
              mountPath: /music/Musique
              subPath: Musique
            - name: music
              mountPath: /music/Musique_sync
              subPath: Musique_sync
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: pvc-media-data
