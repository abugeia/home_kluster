apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: media
data:
  # Config beets — PHASE 1 : nettoyage de Musique_sync (test, protégé par la
  # corbeille Syncthing). Pour traiter Musique/ ensuite, on basculera `directory`
  # et `library` (ou on lancera avec -c une 2e config).
  config.yaml: |
    directory: /music/Musique_sync
    library: /config/beets_sync.db

    # Identification : tags existants + MusicBrainz. (chroma/AcoustID = empreinte
    # acoustique, utile pour les fichiers YouTube mal nommés, à activer plus tard
    # avec une clé AcoustID.)
    # duplicates : LISTE seulement (défaut keep:0, aucune suppression auto).
    # fetchart : pochettes. info : commande d'inspection.
    plugins:
      - musicbrainz # backend MusicBrainz (en beets 2.x c'est un plugin à activer
                    # explicitement — sans lui, l'autotagger ne trouve AUCUN candidat)
      - chroma      # identification par empreinte acoustique (fpcalc/AcoustID)
      - duplicates
      - fetchart
      - info

    # Seules déviations volontaires aux défauts beets :
    import:
      move: yes            # réorg EN PLACE (défaut = copy -> dupliquerait l'espace)
      quiet: yes           # mode automatique (défaut = import interactif)
      # incremental DÉSACTIVÉ : inadapté à un dossier plat nettoyé en place — il fige
      # le dossier dès le 1er passage et saute les fichiers suivants. Sans lui, beets
      # re-scanne tout mais saute sans lookup ce qui est déjà dans sa base (pas de
      # surcoût), et traite bien les nouveaux fichiers déposés par MeTube.
      incremental: no
      log: /config/import_sync.log

    match:
      # Calibré empiriquement sur le vrai contenu (tubes YouTube) :
      # - strong_rec_thresh 0.30 : tolère les suffixes de titre ("- Remastered…").
      # - rec_gap_thresh 0.90 : neutralise la pénalité "near-tie" — un morceau
      #   populaire existe dans des dizaines de releases MusicBrainz quasi
      #   identiques, ce qui faisait skipper beets par excès de prudence.
      # Mesure : fait passer le taux de match auto de ~82% à ~93%, qualité conservée.
      strong_rec_thresh: 0.30
      rec_gap_thresh: 0.90

    # Reste = défauts beets : write:yes, autotag:yes, quiet_fallback:skip,
    # paths Artiste/Album/$track $title, ignore ['.*', ...].
