apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets
  namespace: media
  labels:
    app: beets
spec:
  schedule: "0 10 * * *" # tous les jours à 10:00 (heure locale via timeZone)
  timeZone: "Pacific/Noumea"
  # Replace (pas Forbid) : le serveur s'éteint la nuit (minuit→10h) ; un job coupé
  # peut rester "active" au reboot et bloquerait Forbid. Replace écrase tout résidu
  # au passage de 10h. Pas de parallélisme réel (la fenêtre serveur < durée entre 2
  # passages), donc DB/PVC RWO préservés.
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 1800 # tolère un démarrage du serveur un peu après 10:00
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50400  # 14h : borné à la fenêtre serveur 10h→minuit
      ttlSecondsAfterFinished: 86400 # nettoie les jobs terminés au bout d'un jour
      template:
        metadata:
          labels:
            app: beets
        spec:
          restartPolicy: Never
          # Pas de PUID/PGID : on bypasse l'init s6 (invocation directe de beet),
          # le conteneur tourne donc en root -> écriture OK sur le NFS root:root.
          containers:
            - name: beets
              # Image custom (repo abugeia/beets-ai-tagcleaner) = beets LSIO 2.11 +
              # patch du bug MusicBrainz #6066 (appliqué au build) + plugin aitagcleaner
              # (nettoyage artist/title via LLM Ollama avant matching). Le patch et le
              # plugin sont donc DANS l'image -> command simple, rien au démarrage.
              image: ghcr.io/abugeia/beets-ai-tagcleaner:latest
              imagePullPolicy: Always
              # -s singleton (vrac YouTube), -q non-interactif (skip douteux).
              command:
                ["beet", "-c", "/config-secret/acoustid.yaml", "import", "-q", "-s", "/music/Musique_sync"]
              env:
                - name: BEETSDIR
                  value: /config
                - name: TZ
                  value: Pacific/Noumea
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: config-file
                  mountPath: /config/config.yaml
                  subPath: config.yaml
                - name: music
                  mountPath: /music/Musique_sync
                  subPath: Musique_sync
                - name: acoustid
                  mountPath: /config-secret
                  readOnly: true
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: beets-config
            - name: config-file
              configMap:
                name: beets-config
            - name: music
              persistentVolumeClaim:
                claimName: pvc-media-data
            - name: acoustid
              secret:
                secretName: beets-acoustid
