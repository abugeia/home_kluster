apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets
  namespace: media
  labels:
    app: beets
spec:
  schedule: "0 10 * * *" # tous les jours à 10:00 (heure locale via timeZone)
  timeZone: "Pacific/Noumea"
  # Replace (pas Forbid) : le serveur s'éteint la nuit (minuit→10h) ; un job coupé
  # peut rester "active" au reboot et bloquerait Forbid. Replace écrase tout résidu
  # au passage de 10h. Pas de parallélisme réel (la fenêtre serveur < durée entre 2
  # passages), donc DB/PVC RWO préservés.
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 1800 # tolère un démarrage du serveur un peu après 10:00
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50400  # 14h : borné à la fenêtre serveur 10h→minuit
      ttlSecondsAfterFinished: 86400 # nettoie les jobs terminés au bout d'un jour
      template:
        metadata:
          labels:
            app: beets
        spec:
          restartPolicy: Never
          # Pas de PUID/PGID : on bypasse l'init s6 (invocation directe de beet),
          # le conteneur tourne donc en root -> écriture OK sur le NFS root:root.
          containers:
            - name: beets
              # Image PINNÉE par digest (sortie de :latest) : tout upgrade devient
              # une PR Renovate qu'on review — c'est le garde-fou du patch ci-dessous.
              # = lscr.io/linuxserver/beets:latest au 2026-06-17 (beets 2.11.0).
              image: lscr.io/linuxserver/beets@sha256:bb73b8be1142a7b22e13d6f76f986bec99e60761a967714b098f8d766f88ca37
              imagePullPolicy: IfNotPresent
              # PATCH DÉFENSIF du bug beets >=2.4 (issue beetbox/beets#6066) : le
              # backend MusicBrainz ajoute un paramètre `alias` parasite à la recherche
              # de recordings, qui pollue les titres multi-mots (ex "Love Today" ->
              # "Today Today"). On le retire AU DÉMARRAGE. Le patch vérifie d'abord le
              # motif : s'il a disparu (beets corrigé/changé), il NE TOUCHE À RIEN et
              # logue une alerte — il ne casse jamais l'import. cf docs/music_architecture.md
              # Puis : -s singleton (vrac), -q non-interactif (skip douteux).
              command: ["sh", "-c"]
              args:
                - |
                  MB=$(ls /lsiopy/lib/python*/site-packages/beetsplug/musicbrainz.py 2>/dev/null | head -1)
                  if [ -n "$MB" ] && grep -q '"recording": name, "alias": name' "$MB"; then
                    sed -i 's/"recording": name, "alias": name/"recording": name/' "$MB"
                    echo "[patch-alias] applique (bug beets#6066 neutralise)"
                  else
                    echo "[patch-alias] ATTENTION motif introuvable -> beets a peut-etre corrige le bug, REEVALUER ce patch (docs/music_architecture.md)"
                  fi
                  exec beet -c /config-secret/acoustid.yaml import -q -s /music/Musique_sync
              env:
                - name: BEETSDIR
                  value: /config
                - name: TZ
                  value: Pacific/Noumea
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: config-file
                  mountPath: /config/config.yaml
                  subPath: config.yaml
                - name: music
                  mountPath: /music/Musique_sync
                  subPath: Musique_sync
                - name: acoustid
                  mountPath: /config-secret
                  readOnly: true
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: beets-config
            - name: config-file
              configMap:
                name: beets-config
            - name: music
              persistentVolumeClaim:
                claimName: pvc-media-data
            - name: acoustid
              secret:
                secretName: beets-acoustid
