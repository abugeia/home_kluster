jellyfin:
  env:
    - name: DOTNET_System_Globalization_Invariant
      value: "false"

podLabels:
  sablier.enable: "true"
  sablier.group: "jellyfin.valab.top"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/href: "https://jellyfin.valab.top"
    # TinyAuth removed - SSO plugin handles authentication
    # traefik.ingress.kubernetes.io/router.middlewares: security-tinyauth-protect@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: tools-sablier-1h@kubernetescrd
  hosts:
    - host: jellyfin.valab.top
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: jellyfin-tls
      hosts:
        - jellyfin.valab.top

persistence:
  config:
    enabled: true
    existingClaim: jellyfin-config
  media:
    enabled: false # We use custom volumes/mounts for multiple media paths

volumes:
  - name: media-video
    persistentVolumeClaim:
      claimName: pvc-media-video
      readOnly: true
  - name: media-data
    persistentVolumeClaim:
      claimName: pvc-media-data
      readOnly: true

volumeMounts:
  - name: media-video
    mountPath: /media/video
    readOnly: true
  - name: media-data
    mountPath: /media/data
    readOnly: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 2000m
    memory: 2Gi
