jellyfin:
  env:
    - name: DOTNET_System_Globalization_Invariant
      value: "false"

# Recreate : l'ancien pod s'arrête avant que le nouveau démarre. En
# RollingUpdate, les deux Jellyfin partagent un moment /config (NFS) : les
# DLL de plugins encore ouvertes par l'ancien deviennent des .nfs*, le
# nouveau échoue à supprimer une version remplacée et charge les deux
# (SSO-Auth 4.0.0.4 + 5.1.1 → AmbiguousMatchException sur /sso/OID/start).
# Évite aussi deux processus sur la même base SQLite.
deploymentStrategy:
  type: Recreate

podLabels:
  sablier.enable: "true"
  sablier.group: "jellyfin.valab.top"

service:
  labels:
    sablier.enable: "true"
    sablier.group: "jellyfin.valab.top"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/href: "https://jellyfin.valab.top"
    # TinyAuth removed - SSO plugin handles authentication
    # traefik.ingress.kubernetes.io/router.middlewares: security-tinyauth-protect@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: tools-sablier-jellyfin@kubernetescrd
  hosts:
    - host: jellyfin.valab.top
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: jellyfin-tls
      hosts:
        - jellyfin.valab.top

persistence:
  config:
    enabled: true
    existingClaim: jellyfin-config
  media:
    # Deux PVC (vidéo, data) montés plus bas dans /media/video et /media/data :
    # le volume media du chart n'en gère qu'un, on le désactive.
    enabled: false
    # Désactivé, le chart monte quand même un emptyDir sur /media, et nos deux
    # PVC sont montés DEDANS : runc doit y créer video/ et data/, donc /media
    # doit rester inscriptible. Le chart 3.4.0 a passé ce readOnly à true par
    # défaut (pensé pour NFS, appliqué à tous les types) : conteneur bloqué sur
    # « make mountpoint "/media/video": read-only file system ». Ne pas retirer.
    readOnly: false

volumes:
  - name: media-video
    persistentVolumeClaim:
      claimName: pvc-media-video
      readOnly: true
  - name: media-data
    persistentVolumeClaim:
      claimName: pvc-media-data
      readOnly: true

volumeMounts:
  - name: media-video
    mountPath: /media/video
    readOnly: true
  - name: media-data
    mountPath: /media/data
    readOnly: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Pendant un scan de bibliothèque (ffprobe + SQLite sur NFS, 2 CPU), /health
# peut mettre plusieurs secondes à répondre. Avec les défauts du chart (timeout
# 1s × 3 échecs), le kubelet tuait Jellyfin en plein scan, qui reprenait de zéro.
# Ici : ~2 min sans réponse avant redémarrage.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
