apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-sso-setup
  namespace: media
spec:
  # CronJob suspendu - ne s'exécute jamais automatiquement
  # Pour lancer manuellement: kubectl create job --from=cronjob/jellyfin-sso-setup jellyfin-sso-run -n media
  suspend: true
  schedule: "0 0 31 2 *"  # Date impossible (31 février) pour éviter toute exécution
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # Garder les logs 24h
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: configure-sso
              image: curlimages/curl:8.5.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Waiting for Jellyfin to be ready..."
                  sleep 30
                  
                  echo "Configuring SSO plugin for Pocket ID..."
                  
                  # Configuration OpenID pour Pocket ID
                  curl -v -X POST \
                    -H "Content-Type: application/json" \
                    -d '{
                      "oidEndpoint": "https://auth-id.valab.top/.well-known/openid-configuration",
                      "oidClientId": "'"${CLIENT_ID}"'",
                      "oidSecret": "'"${CLIENT_SECRET}"'",
                      "enabled": true,
                      "enableAuthorization": false,
                      "enableAllFolders": true,
                      "enabledFolders": [],
                      "adminRoles": [],
                      "roles": [],
                      "enableFolderRoles": false,
                      "folderRoleMapping": [],
                      "enableLiveTvRoles": false,
                      "liveTvRoles": [],
                      "liveTvManagementRoles": [],
                      "enableLiveTv": true,
                      "enableLiveTvManagement": false,
                      "roleClaim": "groups",
                      "oidScopes": ["openid", "profile", "email", "groups"],
                      "defaultProvider": "",
                      "defaultUsernameClaim": "email",
                      "avatarUrlFormat": "@{picture}",
                      "disableHttps": false,
                      "doNotValidateEndpoints": true,
                      "doNotValidateIssuerName": true,
                      "schemeOverride": ""
                    }' \
                    "http://jellyfin:8096/sso/OID/Add/pocketid?api_key=${API_KEY}"
                  
                  echo "SSO configuration completed successfully!"
              env:
                - name: CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-sso-credentials
                      key: client-id
                - name: CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-sso-credentials
                      key: client-secret
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-sso-credentials
                      key: api-key
