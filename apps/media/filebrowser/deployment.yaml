apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: media
  labels:
    app: filebrowser
    sablier.enable: "true"
    sablier.group: "files.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # root : nécessaire pour écrire (upload/rename/delete) sur le NFS dont
      # l'arborescence /tank_data/{data,video} est en root:root (no_root_squash).
      # En UID 1000, filebrowser ne pouvait que lire/télécharger. Cohérent avec
      # metube/qbittorrent/syncthing.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "chown -R 0:0 /database"]
          volumeMounts:
            - name: config
              mountPath: /database
      containers:
        - name: filebrowser
          # Le versioning regex exclut les variantes -s6 et par architecture.
          image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
          imagePullPolicy: IfNotPresent
          args:
            - --database
            - /database/filebrowser.db
            - --root
            - /srv
            - --noauth # Bypasses internal auth since we use TinyAuth
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: vol-data
              mountPath: /srv/data
            - name: vol-video
              mountPath: /srv/video
            - name: config
              mountPath: /database
            - name: immich-library
              mountPath: /srv/immich
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: vol-data
          persistentVolumeClaim:
            claimName: pvc-media-data
        - name: vol-video
          persistentVolumeClaim:
            claimName: pvc-media-video
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
        - name: immich-library
          persistentVolumeClaim:
            claimName: immich-library
