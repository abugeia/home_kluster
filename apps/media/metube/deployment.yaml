apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: media
  labels:
    app: metube
    sablier.enable: "true"
    sablier.group: "metube.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metube
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: metube
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1" # Fix potential DNS resolution issues with external domains (avoiding search domain overhead)
      initContainers:
        - name: create-dirs
          image: busybox
          command: ['sh', '-c', 'mkdir -p /mnt/video/Download /mnt/data/Musique_sync']
          volumeMounts:
            - name: video-vol
              mountPath: /mnt/video
            - name: data-vol
              mountPath: /mnt/data
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:latest
          imagePullPolicy: IfNotPresent
          env:
            # UID/GID=0 : MeTube écrit en root sur le NFS (arborescence
            # /tank_data/data en root:root, no_root_squash). En UID 1000 le
            # process de download ne pouvait rien créer dans Musique_sync
            # (« Permission denied »). Cohérent avec syncthing/qbittorrent.
            - name: UID
              value: "0"
            - name: GID
              value: "0"
            - name: DOWNLOAD_DIR
              value: "/mnt/video/Download"
            - name: AUDIO_DOWNLOAD_DIR
              value: "/mnt/data/Musique_sync"
            - name: STATE_DIR
              value: "/data"
            # Playlists téléchargées à plat (pas de sous-dossier par playlist).
            # Défaut MeTube = %(playlist_title)s/%(title)s.%(ext)s → on retire le
            # préfixe dossier pour que tout atterrisse directement dans Musique_sync.
            - name: OUTPUT_TEMPLATE_PLAYLIST
              value: "%(title)s.%(ext)s"
            - name: DEFAULT_OPTION_PLAYLIST_STRICT_MODE
              value: "true"
            - name: DEFAULT_OPTION_PLAYLIST_ITEM_LIMIT
              value: "50"
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: video-vol
              mountPath: /mnt/video
            - name: data-vol
              mountPath: /mnt/data
            - name: state
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              # 2Gi : un gros lot (playlist) lance plusieurs yt-dlp + ffmpeg
              # d'extraction audio en parallèle ; 1Gi suffisait au repos mais
              # provoquait des OOMKilled sur les gros téléchargements groupés.
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: video-vol
          persistentVolumeClaim:
            claimName: pvc-media-video
        - name: data-vol
          persistentVolumeClaim:
            claimName: pvc-media-data
        - name: state
          persistentVolumeClaim:
            claimName: metube-state
