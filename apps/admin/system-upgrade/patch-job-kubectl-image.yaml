# L'image kubectl que le contrôleur injecte dans ses Jobs (pour cordon/uncordon) est
# figée sur v1.30.3 en amont, soit quatre minors sous notre API server — hors de la
# fenêtre de skew supportée par Kubernetes (±1 autour de l'API server). On l'aligne.
#
# v1.35.6 est choisie parce qu'elle est la SEULE valeur valide pour les trois versions
# de cluster de la série de montées en cours : +1 face à un API server en 1.34, pile
# dessus en 1.35, −1 en 1.36. Elle n'aura donc pas à bouger d'un palier à l'autre.
#
# ⚠️ Le contrôleur lit cette ConfigMap par `envFrom` : la valeur est capturée au
# démarrage du pod. La changer ne suffit pas, il faut redémarrer le Deployment
# `system-upgrade-controller` pour qu'elle prenne effet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-controller-env
  namespace: system-upgrade
data:
  SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: "rancher/kubectl:v1.35.6"
