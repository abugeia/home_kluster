---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wetty
  namespace: admin
  labels:
    app: wetty
    sablier.enable: "true"
    sablier.group: "px.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wetty
  template:
    metadata:
      labels:
        app: wetty
    spec:
      containers:
        - name: wetty
          image: wettyoss/wetty:latest@sha256:c52dac712353f2376c39042771cb2bd89fc83c62dd096b05bca1b2c9eab7ee5d
          imagePullPolicy: IfNotPresent
          args:
            - "--base"
            - "/"
            # Exigé depuis la build de 2026-10 : origine autorisée pour le
            # WebSocket (protection contre le détournement cross-site). Sans
            # elle, wetty refuse de démarrer.
            - "--allowed-origin"
            - "https://px.valab.top"
            - "--command"
            - "ssh -o StrictHostKeyChecking=no -p 22 root@10.0.0.10"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
