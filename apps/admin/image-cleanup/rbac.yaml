apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-cleanup
---
# Lecture seule des objets qui déclarent des images. Pas les ReplicaSets :
# les anciens portent les versions remplacées, qu'on veut justement supprimer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-cleanup
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-cleanup
subjects:
  - kind: ServiceAccount
    name: image-cleanup
    namespace: admin
