---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wetty-k3s
  namespace: admin
  labels:
    app: wetty-k3s
    sablier.enable: "true"
    sablier.group: "k3s.valab.top"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wetty-k3s
  template:
    metadata:
      labels:
        app: wetty-k3s
    spec:
      containers:
        - name: wetty
          image: wettyoss/wetty:latest@sha256:c52dac712353f2376c39042771cb2bd89fc83c62dd096b05bca1b2c9eab7ee5d
          imagePullPolicy: IfNotPresent
          args:
            - "--base"
            - "/"
            - "--command"
            - "ssh -o StrictHostKeyChecking=no -i /mnt/ssh/key -p 22 ubuntu@10.0.0.11"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: ssh-key
              mountPath: "/mnt/ssh"
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: ssh-key
          secret:
            secretName: wetty-k3s-ssh-key
            defaultMode: 0400
            optional: false
