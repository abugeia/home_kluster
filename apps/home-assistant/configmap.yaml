apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  # Monté en lecture seule sur /config/configuration.yaml (subPath).
  # HA ne réécrit jamais ce fichier : la config est versionnée ici (GitOps).
  configuration.yaml: |
    default_config:

    # Indispensable derrière Traefik : sans ça HA renvoie une 400
    # "request from a reverse proxy". 10.42.0.0/16 = CIDR des pods k3s
    # (le pod Traefik est la source vue par HA).
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16

    # --- SSO OIDC via Pocket ID (public client / PKCE) ----------------------
    # Add-on auth_oidc installé par l'initContainer du Deployment.
    # Client "Home Assistant" dans Pocket ID, type Public Client (PKCE) ->
    # pas de client_secret, donc client_id non sensible (transite dans l'URL).
    # Callback déclaré côté Pocket ID : https://ha.valab.top/auth/oidc/callback
    auth_oidc:
      client_id: "0ab1ae9e-c7dd-4a8f-a730-7eca540166ed"
      discovery_url: "https://auth-id.valab.top/.well-known/openid-configuration"
      display_name: "Pocket ID"
      features:
        # Skippe la welcome screen de l'add-on (servie sans CSS -> rendu cassé)
        # et redirige directement vers la page de login Pocket ID (stylée).
        # Login HA local de secours : https://ha.valab.top/?skip_oidc_redirect=true
        default_redirect: true
    # ------------------------------------------------------------------------

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
