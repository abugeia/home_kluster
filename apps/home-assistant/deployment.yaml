apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO + instance unique (recorder SQLite)
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      initContainers:
        # Prépare /config : fichiers d'include vides + installe l'add-on OIDC
        # (full GitOps, sans HACS). Idempotent + auto-réparateur.
        - name: bootstrap-config
          image: alpine:3.20
          env:
            - name: OIDC_VERSION
              value: "v1.1.0" # christiaangoossens/hass-oidc-auth
          command:
            - sh
            - -c
            - |
              set -e
              cd /config
              mkdir -p custom_components
              [ -f automations.yaml ] || echo "[]" > automations.yaml
              [ -f scripts.yaml ] || echo "{}" > scripts.yaml
              [ -f scenes.yaml ] || echo "[]" > scenes.yaml
              # On installe depuis l'ASSET DE RELEASE (zip packagé), pas le tarball
              # source : ce dernier ne contient pas le CSS compilé (static/style.css),
              # ce qui casse le rendu des pages de login. La condition sur style.css
              # déclenche aussi une réinstallation des installs incomplètes.
              if [ ! -f custom_components/auth_oidc/static/style.css ]; then
                echo "Installing hass-oidc-auth ${OIDC_VERSION} (release asset)..."
                command -v unzip >/dev/null || apk add --no-cache unzip
                rm -rf custom_components/auth_oidc /tmp/auth_oidc /tmp/auth_oidc.zip
                mkdir -p /tmp/auth_oidc
                wget -qO /tmp/auth_oidc.zip \
                  "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/${OIDC_VERSION}/hass-oidc-auth.zip"
                unzip -q /tmp/auth_oidc.zip -d /tmp/auth_oidc
                mv /tmp/auth_oidc custom_components/auth_oidc
                rm -f /tmp/auth_oidc.zip
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Pacific/Noumea"
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /manifest.json # accessible sans auth
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-config
