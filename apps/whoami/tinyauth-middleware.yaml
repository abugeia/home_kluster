# Copie locale du Middleware `security/tinyauth-protect`.
#
# Pourquoi une copie plutôt qu'une référence : le filtre ExtensionRef d'un
# HTTPRoute est un LocalObjectReference, dont la spec Gateway API v1.4.0 ne
# définit QUE group / kind / name — il n'existe pas de champ namespace. Un
# HTTPRoute ne peut donc référencer que des extensions de son propre namespace.
# C'est délibéré (empêcher un auteur de route de s'attacher un middleware
# privilégié d'un autre namespace) : c'est précisément le garde-fou que
# CVE-2026-65601 avait contourné dans Traefik v3.7.0 -> v3.7.6.
#
# L'annotation d'Ingress `security-tinyauth-protect@kubernetescrd`, elle, porte
# le namespace dans sa valeur et fonctionne grâce à allowCrossNamespace=true.
# C'est le coût que ce pilote sert à mesurer : à l'échelle des 17 Ingress
# protégés, cette copie devrait être industrialisée (Reflector est déjà déployé).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-protect
  namespace: whoami
spec:
  forwardAuth:
    address: http://tinyauth.security.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
      - Remote-User
      - Remote-Email
      - Remote-Name
