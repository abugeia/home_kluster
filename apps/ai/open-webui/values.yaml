# Open WebUI — frontend LLM pointant l'Ollama de la VM ai-gaming (810→815).
# Doc chart : https://github.com/open-webui/helm-charts

# Pas de sous-chart Ollama : on consomme l'Ollama externe de la VM
# ai-gaming (10.0.0.15:11434), qui a le GPU (RTX 5070 Ti) en passthrough.
ollama:
  enabled: false
ollamaUrls:
  - http://10.0.0.15:11434

# Pipelines (plugins Python) non nécessaires pour un usage chat simple.
pipelines:
  enabled: false

# Persistance des conversations / config (même classe que le reste du lab).
persistence:
  enabled: true
  size: 5Gi
  storageClass: nfs-csi-nvme

# Ingress Traefik + TLS cert-manager (letsencrypt), cohérent avec les
# autres apps. cert-manager remplit le secret open-webui-tls via
# l'annotation cluster-issuer.
ingress:
  enabled: true
  class: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/description: "Chat LLM local (Ollama / RTX 5070 Ti)"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "open-webui"
    gethomepage.dev/href: "https://chat.valab.top"
  host: chat.valab.top
  tls: true
  existingSecret: open-webui-tls

# Auth : SSO OIDC via Pocket ID (auth-id.valab.top). Le formulaire de
# login interne est désactivé (ENABLE_LOGIN_FORM=false) → accès 100% SSO.
# Le client OAuth a été créé dans Pocket ID (redirect
# https://chat.valab.top/oauth/oidc/callback) ; CLIENT_ID/SECRET viennent
# du sealed-secret open-webui-oidc-secret (secrets/sealed/open-webui.yaml).
# 1er utilisateur OAuth = admin (ENABLE_OAUTH_SIGNUP).
extraEnvVars:
  - name: WEBUI_NAME
    value: "Valab AI"
  - name: WEBUI_URL
    value: "https://chat.valab.top"
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: OPENID_PROVIDER_URL
    value: "https://auth-id.valab.top/.well-known/openid-configuration"
  - name: OAUTH_PROVIDER_NAME
    value: "Pocket ID"
  - name: OAUTH_SCOPES
    value: "openid email profile groups"
  - name: ENABLE_LOGIN_FORM
    value: "false"
  # --- Recherche web via SearXNG self-hosted (namespace ai, interne) ---
  # SearXNG doit avoir `formats: [html, json]` (sinon 403). Le /search?q=<query>
  # est obligatoire. <query> est un placeholder littéral remplacé par OpenWebUI.
  # NB : ces clés sont des PersistentConfig → l'env n'amorce la DB que si la
  # conf web search est encore vide (c'était le cas). Vérifier le toggle dans
  # Admin → Paramètres → Recherche web après le 1er sync.
  - name: ENABLE_WEB_SEARCH
    value: "true"
  - name: WEB_SEARCH_ENGINE
    value: "searxng"
  - name: SEARXNG_QUERY_URL
    value: "http://searxng:8080/search?q=<query>"
  # Loader = Playwright (navigateur distant) : récupère le TEXTE COMPLET des
  # articles (le loader requests par défaut échoue ; l'image OWUI n'a pas de
  # navigateur). Le serveur Playwright est déployé à part (apps/ai/playwright).
  # gpt-oss (format harmony) ne renvoie pas une requête JSON propre quand
  # OpenWebUI lui demande de générer une requête de recherche → "Aucune requête
  # générée" → la recherche est annulée. On désactive la génération : OpenWebUI
  # utilise la phrase de l'utilisateur comme requête (suffisant ici).
  - name: ENABLE_SEARCH_QUERY_GENERATION
    value: "false"
  - name: WEB_LOADER_ENGINE
    value: "playwright"
  - name: PLAYWRIGHT_WS_URL
    value: "ws://playwright:3000/"
  # On NE bypasse PLUS le loader : on veut lire le vrai contenu via Playwright.
  - name: BYPASS_WEB_SEARCH_WEB_LOADER
    value: "false"
  # Embedding/retrieval actif : on découpe le contenu des articles et on ne
  # garde que les passages pertinents (évite de saturer le contexte). RAM OK (2Gi).
  - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
    value: "false"
  # Modèle proposé par défaut dans l'UI.
  - name: DEFAULT_MODELS
    value: "gpt-oss:20b"

# CLIENT_ID/SECRET OAuth injectés depuis le sealed-secret.
extraEnvFrom:
  - secretRef:
      name: open-webui-oidc-secret

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "2"
    # 1Gi était trop juste (frontend + embedding RAG ~800Mio-1Go) → /api/config
    # timeout au chargement. 2Gi = marge confortable pour RAG/recherche web.
    memory: 2Gi
