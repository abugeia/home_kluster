# Open WebUI — frontend LLM pointant l'Ollama de la VM ai-gaming (810→815).
# Doc chart : https://github.com/open-webui/helm-charts

# Pas de sous-chart Ollama : on consomme l'Ollama externe de la VM
# ai-gaming (10.0.0.15:11434), qui a le GPU (RTX 5070 Ti) en passthrough.
ollama:
  enabled: false
ollamaUrls:
  - http://10.0.0.15:11434

# Pipelines (plugins Python) non nécessaires pour un usage chat simple.
pipelines:
  enabled: false

# Persistance des conversations / config (même classe que le reste du lab).
persistence:
  enabled: true
  size: 5Gi
  storageClass: nfs-csi-nvme

# Ingress Traefik + TLS cert-manager (letsencrypt), cohérent avec les
# autres apps. cert-manager remplit le secret open-webui-tls via
# l'annotation cluster-issuer.
ingress:
  enabled: true
  class: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/description: "Chat LLM local (Ollama / RTX 5070 Ti)"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "open-webui"
    gethomepage.dev/href: "https://chat.valab.top"
  host: chat.valab.top
  tls: true
  existingSecret: open-webui-tls

# Auth : SSO OIDC via Pocket ID (auth-id.valab.top). Le formulaire de
# login interne est désactivé (ENABLE_LOGIN_FORM=false) → accès 100% SSO.
# Le client OAuth a été créé dans Pocket ID (redirect
# https://chat.valab.top/oauth/oidc/callback) ; CLIENT_ID/SECRET viennent
# du sealed-secret open-webui-oidc-secret (secrets/sealed/open-webui.yaml).
# 1er utilisateur OAuth = admin (ENABLE_OAUTH_SIGNUP).
extraEnvVars:
  - name: WEBUI_NAME
    value: "Valab AI"
  - name: WEBUI_URL
    value: "https://chat.valab.top"
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: OPENID_PROVIDER_URL
    value: "https://auth-id.valab.top/.well-known/openid-configuration"
  - name: OAUTH_PROVIDER_NAME
    value: "Pocket ID"
  - name: OAUTH_SCOPES
    value: "openid email profile groups"
  - name: ENABLE_LOGIN_FORM
    value: "false"

# CLIENT_ID/SECRET OAuth injectés depuis le sealed-secret.
extraEnvFrom:
  - secretRef:
      name: open-webui-oidc-secret

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
