apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu
  namespace: ai
  labels:
    app: ollama-cpu
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO
  selector:
    matchLabels:
      app: ollama-cpu
  template:
    metadata:
      labels:
        app: ollama-cpu
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Node 6 cœurs quasi idle → on laisse Ollama utiliser tous les cœurs
            # pour accélérer l'inférence CPU (query-gen + nettoyage de tags).
            - name: OLLAMA_NUM_THREADS
              value: "6"
            # Tâches courtes (requête web, nettoyage de tag) → 8K de contexte
            # largement suffisant. Évite le KV cache géant (256k par défaut sur
            # les modèles récents) qui faisait OOM le pod sur CPU.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            # Pas de GPU sur ce nœud/pod → Ollama tourne en CPU. On garde le
            # modèle chargé longtemps (tâches sporadiques : query-gen, titres).
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          ports:
            - name: http
              containerPort: 11434
          # Pull du petit modèle de tâches au démarrage (idempotent : no-op si
          # déjà dans le PVC). Non-harmony → JSON propre pour la query-gen.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 5; ollama pull llama3.2:3b || true"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "6"
              memory: "5Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-cpu-models
