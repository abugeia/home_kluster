apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu
  namespace: ai
  labels:
    app: ollama-cpu
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO
  selector:
    matchLabels:
      app: ollama-cpu
  template:
    metadata:
      labels:
        app: ollama-cpu
    spec:
      containers:
        - name: ollama
          # Semver propre côté upstream ; le versioning regex exclut les
          # préversions -rcN et les variantes -rocm.
          image: ollama/ollama:0.40.11
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Node 6 cœurs quasi idle → on laisse Ollama utiliser tous les cœurs
            # pour accélérer l'inférence CPU (query-gen + nettoyage de tags).
            - name: OLLAMA_NUM_THREADS
              value: "6"
            # Tâches courtes (requête web, nettoyage de tag) → 8K de contexte
            # largement suffisant. Évite le KV cache géant (256k par défaut sur
            # les modèles récents) qui faisait OOM le pod sur CPU.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            # Pas de GPU sur ce nœud/pod → Ollama tourne en CPU. On garde le
            # modèle chargé longtemps (tâches sporadiques : query-gen, titres).
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Source de vérité des modèles présents sur le PVC (séparés par des
            # espaces). Le postStart pulle cette liste et SUPPRIME tout modèle
            # hors liste : un `ollama pull` manuel ne survit pas au redémarrage.
            # UN SEUL modèle partagé par beets (aitagcleaner) et le task model
            # d'OpenWebUI : 2 modèles chargés ensemble dépassent la limite 5Gi.
            # gemma3:4b retenu au banc d'essai du 2026-10-16 (0 tag propre altéré ;
            # llama3.2:3b en altérait 14/21, qwen3.5:4b retire les « (… Remix) »,
            # gemma4:e2b/e4b ne tiennent pas en 5Gi).
            - name: MANAGED_MODELS
              value: "gemma3:4b"
          ports:
            - name: http
              containerPort: 11434
          # Réconcilie les modèles avec MANAGED_MODELS au démarrage (idempotent :
          # pull no-op si déjà dans le PVC). Ne doit jamais échouer, sinon
          # Kubernetes tue le conteneur.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 5
                    for m in $MANAGED_MODELS; do ollama pull "$m" || true; done
                    ollama list | awk 'NR>1 {print $1}' | while read -r m; do
                      case " $MANAGED_MODELS " in
                        *" $m "*) ;;
                        *) ollama rm "$m" || true ;;
                      esac
                    done
                    true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "6"
              memory: "5Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-cpu-models
