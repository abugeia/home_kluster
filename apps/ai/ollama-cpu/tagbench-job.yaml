# TEMPORAIRE (banc 2026-11) : compare lfm3:1.7b à gemma3:4b sur les deux usages
# d'ollama-cpu, avec la même version d'Ollama pour les deux.
#   1) nettoyage de tags beets : bench/ du repo beets-ai-tagcleaner (52 cas réels,
#      prompt v2 de l'image), figé au commit ci-dessous ;
#   2) génération de requêtes web d'Open WebUI : querybench.py (prompt par défaut
#      d'OWUI, appel /api/chat sans format json, comme OWUI).
# Sortie JSONL dans les logs du pod (kubectl logs job/tagbench -n ai).
# Pas de ttlSecondsAfterFinished : Argo CD recréerait le Job supprimé (selfHeal)
# et relancerait le banc en boucle. Job + ConfigMap à retirer après le banc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tagbench
  namespace: ai
data:
  querybench.py: |
    import json, os, re, time, urllib.request
    URL = "http://ollama-cpu.ai:11434"
    # DEFAULT_QUERY_GENERATION_PROMPT_TEMPLATE d'Open WebUI (backend/open_webui/config.py).
    TPL = """### Task:
    Analyze the chat history to determine the necessity of generating search queries, in the given language. By default, **prioritize generating 1-3 broad and relevant search queries** unless it is absolutely certain that no additional information is required. The aim is to retrieve comprehensive, updated, and valuable information even with minimal uncertainty. If no search is unequivocally needed, return an empty list.

    ### Guidelines:
    - Respond **EXCLUSIVELY** with a JSON object. Any form of extra commentary, explanation, or additional text is strictly prohibited.
    - When generating search queries, respond in the format: { "queries": ["query1", "query2"] }, ensuring each query is distinct, concise, and relevant to the topic.
    - If and only if it is entirely certain that no useful results can be retrieved by a search, return: { "queries": [] }.
    - Err on the side of suggesting search queries if there is **any chance** they might provide useful or updated information.
    - Be concise and focused on composing high-quality search queries, avoiding unnecessary elaboration, commentary, or assumptions.
    - Today's date is: 2026-11-03.
    - Always prioritize providing actionable and broad queries that maximize informational coverage.

    ### Output:
    Strictly return in JSON format:
    {
      "queries": ["query1", "query2"]
    }

    ### Chat History:
    <chat_history>
    USER: %s
    </chat_history>
    """
    QUESTIONS = [
        "Quelle est la météo prévue à Nouméa ce week-end ?",
        "Quelles sont les nouveautés de Kubernetes 1.36 ?",
        "Compare le Ryzen 9 9950X et l'Intel Core Ultra 9 285K pour la compilation",
        "Qui a gagné le dernier Grand Prix de F1 ?",
        "Comment configurer un tunnel Cloudflare pour exposer Home Assistant ?",
        "Quels films sortent au cinéma ce mois-ci ?",
        "Prix actuel de l'électricité en Nouvelle-Calédonie pour les particuliers",
        "Est-ce que le Steam Deck 2 est sorti ?",
        "Recette de bougna au poulet",
        "Merci, c'est parfait !",
    ]
    def chat(model, content):
        body = {"model": model, "stream": False,
                "messages": [{"role": "user", "content": content}]}
        req = urllib.request.Request(URL + "/api/chat", data=json.dumps(body).encode(),
                                     headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=300) as r:
            return json.load(r)["message"]["content"]
    for model in os.environ["MODELS"].split(","):
        for i, q in enumerate(QUESTIONS):
            t0 = time.time()
            try:
                raw = chat(model, TPL % q); err = None
            except Exception as e:
                raw = ""; err = str(e)[:200]
            # Même extraction qu'OWUI : du premier { au dernier }.
            m = re.search(r"\{.*\}", raw, re.S); queries = None
            try:
                queries = json.loads(m.group(0))["queries"] if m else None
            except Exception:
                pass
            print(json.dumps({"qbench": model, "i": i, "q": q, "queries": queries,
                              "raw": raw[:400], "err": err,
                              "dt": round(time.time() - t0, 2)}, ensure_ascii=False), flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tagbench
  namespace: ai
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          # Image du plugin : bench.py importe le prompt v2 depuis beetsplug.
          image: ghcr.io/abugeia/beets-ai-tagcleaner:latest
          imagePullPolicy: Always
          env:
            - name: MODELS
              value: "gemma3:4b,lfm3:1.7b"
            - name: PROMPTS
              value: "v2"
            - name: BENCH_REF
              value: e23edd572c267a75f6224005a013090b6fd0475f
          # Attend que les deux modèles soient sur le PVC (pull au postStart après
          # le passage d'Ollama en >= 0.40.12), puis lance les deux bancs.
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /s && cp /q/querybench.py /s/
              B=https://raw.githubusercontent.com/abugeia/beets-ai-tagcleaner/$BENCH_REF/bench
              python3 -c "import sys,urllib.request as u;[u.urlretrieve(sys.argv[1]+'/'+f,'/s/'+f) for f in ('bench.py','cases.json')]" "$B"
              python3 - <<'EOF'
              import json, os, time, urllib.request
              want = set(os.environ["MODELS"].split(","))
              for _ in range(720):
                  try:
                      have = {m["name"] for m in json.load(urllib.request.urlopen("http://ollama-cpu.ai:11434/api/tags"))["models"]}
                      v = json.load(urllib.request.urlopen("http://ollama-cpu.ai:11434/api/version"))["version"]
                      if want <= have:
                          print(json.dumps({"ready": sorted(have), "ollama": v}), flush=True); break
                  except Exception as e:
                      print(json.dumps({"wait": str(e)[:100]}), flush=True)
                  time.sleep(10)
              else:
                  raise SystemExit("modèles absents après 2h : %s" % want)
              EOF
              python3 -u /s/bench.py
              python3 -u /s/querybench.py
          volumeMounts:
            - name: querybench
              mountPath: /q
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: querybench
          configMap:
            name: tagbench
