# MLflow Helm Values - Boten Anna
# Chart: community-charts/mlflow (version dans kustomization.yaml)

# --- Image ---
# Image officielle au lieu de burakince/mlflow (image par défaut du chart),
# figée en 3.16.0 depuis septembre 2026 comme le chart lui-même : pas de
# correctif de CVE-2026-116692 (RCE, corrigée en 3.17.0). La variante -full
# embarque psycopg2 (extra db) et boto3 (extra extras), requis pour Postgres
# et S3. Tag suivi par Renovate via le customManager regex de renovate.json.
image:
  repository: ghcr.io/mlflow/mlflow
  # renovate: datasource=docker depName=ghcr.io/mlflow/mlflow
  tag: v3.18.0-full

initImages:
  mlflowDbMigration:
    repository: ghcr.io/mlflow/mlflow
    # renovate: datasource=docker depName=ghcr.io/mlflow/mlflow
    tag: v3.18.0-full

# --- Backend Store (PostgreSQL externe - LXC Proxmox) ---
backendStore:
  databaseMigration: true
  databaseConnectionCheck: true

  postgres:
    enabled: true
    host: "10.0.0.12"
    port: 5432
    database: "mlflow_db"
    user: "mlflow"
    # SQLAlchemy 2.1 (image officielle) prend psycopg 3 par défaut pour
    # postgresql:// ; sur une base SQL_ASCII (mlflow_db), psycopg 3 renvoie des
    # bytes et la connexion échoue (« cannot use a string pattern on a
    # bytes-like object »). psycopg2 décode correctement.
    driver: psycopg2
    password: ""  # Ignoré car on utilise existingDatabaseSecret

  existingDatabaseSecret:
    name: "mlflow-pg-secret"    # Créé automatiquement par Ansible
    usernameKey: "username"
    passwordKey: "password"

# --- Artifact Store (S3 Garage - LXC Proxmox) ---
artifactRoot:
  proxiedArtifactStorage: true

  s3:
    enabled: true
    bucket: "mlflow"
    path: ""

    existingSecret:
      name: "mlflow-s3-secrets"
      keyOfAccessKeyId: "access-key"
      keyOfSecretAccessKey: "secret-key"

# Désactiver les sous-charts BDD intégrés
postgresql:
  enabled: false

mysql:
  enabled: false

# --- Variables d'environnement supplémentaires ---
extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: "http://garage.storage.svc.cluster.local:3900"
  MLFLOW_S3_IGNORE_TLS: "true"
  MLFLOW_SERVER_ALLOWED_HOSTS: "*.valab.top,mlflow.ai.svc.cluster.local,localhost"

# --- Service ---
service:
  type: ClusterIP
  port: 5000

# --- Ingress (mlflow.valab.top avec SSO TinyAuth) ---
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: security-tinyauth-protect@kubernetescrd,tools-sablier-mlflow@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=mlflow"
    gethomepage.dev/name: "MLflow"
    gethomepage.dev/description: "Tracking d'expériences ML"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "si-mlflow"
    gethomepage.dev/href: "https://mlflow.valab.top"
  hosts:
    - host: mlflow.valab.top
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mlflow.valab.top
      secretName: mlflow-tls
