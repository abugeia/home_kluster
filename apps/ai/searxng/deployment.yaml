apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
      annotations:
        # Force le redémarrage du pod quand settings.yml change (sinon le
        # ConfigMap monté est mis à jour mais SearXNG ne le relit pas).
        checksum/settings: searxng-settings-v3
    spec:
      # CRUCIAL : sans ça, k8s injecte SEARXNG_PORT=tcp://<svc-ip>:8080 (env de
      # service legacy, car le Service s'appelle "searxng") → le serveur granian
      # de SearXNG lit cette valeur comme --port et crashe ("not a valid
      # integer"). On coupe l'injection des service-links legacy.
      enableServiceLinks: false
      containers:
        - name: searxng
          # SearXNG ne publie que des tags <CalVer>-<sha git>, plusieurs par jour :
          # aucun ordre de version exploitable. On épingle donc le digest derrière
          # :latest, que Renovate rafraîchit (update type « digest »).
          image: docker.io/searxng/searxng:latest@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
            # Instance interne mono-utilisateur.
            - name: INSTANCE_NAME
              value: "valab-searxng"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
