apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  namespace: ai
  labels:
    app: playwright
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright
  template:
    metadata:
      labels:
        app: playwright
    spec:
      # Évite l'injection des env de service legacy (PLAYWRIGHT_PORT=tcp://...)
      # par k8s, par cohérence/prudence (cf. searxng).
      enableServiceLinks: false
      containers:
        - name: playwright
          # Version DOIT matcher le client playwright bundlé dans OpenWebUI
          # (`pip show playwright` dans le pod open-webui = 1.60.0 depuis l'app
          # 0.11.0). Sinon le protocole de connexion casse.
          #
          # Les DEUX références ci-dessous doivent bouger ensemble : l'image fournit
          # les navigateurs, la commande npx installe le client qui les pilote. Ce
          # fichier est exclu de Renovate (renovate.json) parce que la version cible
          # n'est pas la dernière publiée mais celle qu'OpenWebUI embarque — l'amont
          # était en 1.62.1 quand il fallait 1.60.0.
          image: mcr.microsoft.com/playwright:v1.60.0-noble
          command: ["/bin/sh", "-c"]
          args:
            - npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0
          ports:
            - name: ws
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # Chromium plante avec le /dev/shm par défaut de k8s (64 Mio).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
