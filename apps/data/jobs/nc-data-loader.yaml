apiVersion: batch/v1
kind: CronJob
metadata:
  name: nc-data-loader
  namespace: data # Assuming a namespace, or default
spec:
  schedule: "0 19 * * *" # Runs at 06:00 NC Time (UTC+11) -> 19:00 UTC previous day
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: loader
            image: harbor.valab.top/prod/dlt-dataloader:latest
            imagePullPolicy: Always
            env:
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__HOST
              value: "clickhouse-clickhouse.data.svc.cluster.local"
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__PORT
              value: "9000"
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__HTTP_PORT
              value: "8123"
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__SECURE
              value: "0"
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__USERNAME
              value: "dataloader"
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth-dataloader
                  key: password
            - name: DESTINATION__CLICKHOUSE__CREDENTIALS__DATABASE
              value: "nc_vehicules"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RUNTIME__LOG_LEVEL
              value: "INFO"
            - name: RUNTIME__PROGRESS
              value: "log"
            resources:
              requests:
                cpu: "250m"
                memory: "1Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: harbor-cicd-secret
