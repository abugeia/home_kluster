# Configuration GitOps pour le chart Altinity Clickhouse v0.3.8
# Ce chart gère l'installation de l'opérateur et du cluster via des paramètres plats.

operator:
  enabled: true
  # L'opérateur sera installé dans le namespace de destination (data) fixé par ArgoCD.

clickhouse:
  # Nombre de réplicas pour le cluster Clickhouse
  replicasCount: 1
  
  # Configuration de l'image (utilisant ECR pour éviter les quotas Docker Hub)
  image:
    repository: public.ecr.aws/altinity/altinity/clickhouse-server
    tag: "23.8.15.35"

  # Configuration de la persistence
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "nfs-csi-nvme"
    accessMode: ReadWriteOnce
    logs:
      enabled: true
      size: 5Gi
      storageClass: "nfs-csi-nvme"
      accessMode: ReadWriteOnce

  # Paramètres de configuration Clickhouse (format dictionnaire)
  settings:
    logger/level: "information"
    max_connections: 1024
    
  # ==========================================
  # Configuration des Utilisateurs
  # ==========================================
  users:
    - name: admin
      password_secret_name: "clickhouse-auth-admin"
      hostIP: ["::/0", "0.0.0.0/0"]
      accessManagement: 1

    # User par défaut sécurisé (accès local uniquement)
    - name: default
      hostIP: ["127.0.0.1/32", "::1/128"]
      profile: "default"
      # On pourrait aussi lui mettre un mot de passe pour plus de sécurité
      # k8s_secret_name: "clickhouse-auth"
      # k8s_secret_key: "default-password"

    # User pour l'ingestion (DLT)
    - name: dataloader
      password_secret_name: "clickhouse-auth-dataloader"
      hostIP: ["::/0", "0.0.0.0/0"]
      profile: "default"
      accessManagement: 1
      grants:
        - "ALL ON nc_vehicules.*"

    # User pour la visualisation (Superset)
    - name: superset
      password_secret_name: "clickhouse-auth-superset"
      hostIP: ["::/0", "0.0.0.0/0"]
      profile: "readonly"
      grants:
        - "SELECT ON nc_vehicules.*"

  # Profils personnalisés
  profiles:
    readonly/readonly: "1"

