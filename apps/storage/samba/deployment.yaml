apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      containers:
      - name: samba
        # Épinglée sur le digest en service : l'image n'a pas de tag de version et
        # n'est plus maintenue depuis 2021 (remplacement à prévoir).
        image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
        # Pas de `-p` : il lance à chaque démarrage un chown -R + chmod récursif sur
        # tous les partages. Sur Data_NVMe (racine de nfs-csi-nvme), il remettait
        # en root:root les PV de toutes les applis non-root (valkey, pocketid,
        # pgadmin, traefik…), qui perdaient l'écriture sur leurs propres données.
        # `force user = root` suffit à Samba pour lire et écrire partout.
        args:
          - "-g"
          - "force user = root"
          - "-g"
          - "socket options = TCP_NODELAY"
          - "-g"
          - "oplocks = no"
          - "-g"
          - "level2 oplocks = no"
          - "-g"
          - "kernel oplocks = no"
          - "-g"
          - "strict locking = yes"
          - "-g"
          - "aio read size = 16384"
          - "-g"
          - "aio write size = 16384"
          - "-g"
          - "getwd cache = yes"
          - "-g"
          - "use sendfile = no"
          - "-g"
          - "server multi channel support = yes"
          - "-g"
          - "min receivefile size = 16384"
          # Syntaxe -s : "Nom;Chemin;Visible;LectureSeule;Invite;Utilisateurs"
          - "-s"
          - "Data;/share/zfs/data;yes;no;no;user"
          - "-s"
          - "Video;/share/zfs/video;yes;no;no;user"
          # Lecture seule : consultation des données d'applis depuis Windows. Un
          # fichier écrit par ce partage deviendrait root:root dans le PV d'une
          # appli non-root.
          - "-s"
          - "Data_NVMe;/share/nvme;yes;yes;no;user"
          # Syntaxe -u : "Utilisateur;MotDePasse"
          - "-u"
          - "user;$(SAMBA_PASSWORD)"
        env:
        - name: USERID
          value: "0"
        - name: GROUPID
          value: "0"
        - name: SAMBA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: samba-secret
              key: password
        ports:
        - containerPort: 445
          name: smb
        volumeMounts:
        - name: video
          mountPath: /share/zfs/video
        - name: data
          mountPath: /share/zfs/data
        - name: nvme
          mountPath: /share/nvme
          readOnly: true # doublon voulu du partage en lecture seule
        livenessProbe:
          exec:
            command:
            - ls
            - /share/zfs/data
          initialDelaySeconds: 60
          periodSeconds: 300
          timeoutSeconds: 30
          failureThreshold: 3
      volumes:
      - name: video
        persistentVolumeClaim:
          claimName: pvc-samba-video
      - name: data
        persistentVolumeClaim:
          claimName: pvc-samba-data
      - name: nvme
        persistentVolumeClaim:
          claimName: pvc-samba-nvme
