# Service headless pour exposer le LXC Garage (10.0.0.14) dans le cluster K8s.
# Pattern standard K8s : Service sans selector + Endpoints manuels.
# Note : nécessite que resource.exclusions soit vidé dans la config ArgoCD
# (par défaut ArgoCD exclut les Endpoints).
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: storage
spec:
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
    - name: s3-web
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
---
apiVersion: v1
kind: Endpoints
metadata:
  name: garage
  namespace: storage
subsets:
  - addresses:
      - ip: 10.0.0.14
    ports:
      - name: s3-api
        port: 3900
      - name: s3-web
        port: 3902
      - name: admin
        port: 3903
