---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: storage
  labels:
    app: garage-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage-webui
  template:
    metadata:
      labels:
        app: garage-webui
    spec:
      containers:
        - name: garage-webui
          image: khairul169/garage-webui:latest
          ports:
            - containerPort: 3909
          env:
            - name: API_BASE_URL
              value: "http://garage.storage.svc.cluster.local:3903"
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-admin-secret
                  key: admin-token
            - name: S3_ENDPOINT_URL
              value: "http://garage.storage.svc.cluster.local:3900"
            - name: S3_REGION
              value: "garage"
          livenessProbe:
            httpGet:
              path: /
              port: 3909
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3909
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: storage
spec:
  selector:
    app: garage-webui
  ports:
    - port: 80
      targetPort: 3909
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-webui
  namespace: storage
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: security-tinyauth-protect@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - garage.valab.top
      secretName: garage-webui-tls
  rules:
    - host: garage.valab.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-webui
                port:
                  number: 80
