---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketid-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: security
  labels:
    app: pocketid
spec:
  replicas: 1
  # Recreate : l'ancien pod s'arrête avant que le nouveau démarre. En
  # RollingUpdate, deux pods partagent un moment le volume : deux écrivains
  # sur la même base SQLite. Cf. Jellyfin, plugin SSO chargé en double
  # (PR #77).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketid
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:v2.19.2
          ports:
            - containerPort: 1411
          env:
            - name: APP_URL
              value: "https://auth-id.valab.top"
            - name: SESSION_DURATION
              value: "10080"
            - name: UI_CONFIG_DISABLED
              value: "true"
            - name: PUBLIC_REGISTRATION
              value: "false"
            - name: TRUST_PROXY
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DEBUG
              value: "false"
            - name: GIN_MODE
              value: "release"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: pocketid-encryption-key
            # Base sur le Postgres du LXC 112 (10.0.0.12), couverte par le dump
            # quotidien de pve1. Secret créé par Ansible (infra_proxmox,
            # postgresql_databases → pocketid-pg-secret). Mot de passe
            # alphanumérique : inséré tel quel dans l'URL.
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pocketid-pg-secret
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocketid-pg-secret
                  key: password
            - name: DB_CONNECTION_STRING
              value: "postgres://$(PG_USER):$(PG_PASSWORD)@10.0.0.12:5432/pocketid_db?sslmode=disable"
            # Images (photos de profil, logos) stockées dans la base : plus
            # rien à sauvegarder sur le volume.
            - name: FILE_BACKEND
              value: database
          # Volume SQLite d'avant la migration : plus utilisé, gardé monté
          # pour pouvoir revenir en arrière (revert de cette PR). À retirer
          # une fois la migration validée (phase 4).
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketid-data
---
apiVersion: v1
kind: Service
metadata:
  name: pocketid
  namespace: security
spec:
  selector:
    app: pocketid
  ports:
    - port: 80
      targetPort: 1411
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocketid
  namespace: security
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth-id.valab.top
      secretName: pocketid-tls
  rules:
    - host: auth-id.valab.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocketid
                port:
                  number: 80
