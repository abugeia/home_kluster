# Deux Ingress sur le même host pour appliquer des middlewares différents par path :
#   /      -> web (basic auth)
#   /api   -> api (strip /api + basic auth)
# Traefik priorise automatiquement /api (préfixe plus long) sur /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vfnc-web
  namespace: dinum
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dinum-vfnc-basicauth@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vfnc.valab.top
      secretName: vfnc-tls
  rules:
    - host: vfnc.valab.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vfnc-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vfnc-api
  namespace: dinum
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dinum-vfnc-basicauth@kubernetescrd,dinum-vfnc-api-stripprefix@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vfnc.valab.top
      secretName: vfnc-tls
  rules:
    - host: vfnc.valab.top
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vfnc-api
                port:
                  number: 8000
