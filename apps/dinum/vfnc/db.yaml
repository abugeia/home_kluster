apiVersion: v1
kind: Service
metadata:
  name: vfnc-db
  namespace: dinum
  labels:
    app.kubernetes.io/name: vfnc-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vfnc-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vfnc-db
  namespace: dinum
  labels:
    app.kubernetes.io/name: vfnc-db
spec:
  serviceName: vfnc-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vfnc-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vfnc-db
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:18-3.6
          envFrom:
            - secretRef:
                name: vfnc-db
          env:
            # Sous-répertoire pour éviter les soucis de propriété sur la racine du volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
