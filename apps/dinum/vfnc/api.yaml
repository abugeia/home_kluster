apiVersion: apps/v1
kind: Deployment
metadata:
  name: vfnc-api
  namespace: dinum
  labels:
    app.kubernetes.io/name: vfnc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vfnc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vfnc-api
    spec:
      imagePullSecrets:
        - name: harbor-cicd-secret # répliqué par Reflector (label ns replicate-harbor-cicd)
      containers:
        - name: api
          image: harbor.valab.top/prod/vfnc-api:main
          imagePullPolicy: Always
          # Surcharge du CMD dev (pas de --reload), root-path pour /api/docs derrière Traefik.
          command:
            ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
          envFrom:
            - secretRef:
                name: vfnc-db # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
          env:
            - name: POSTGRES_HOST
              value: vfnc-db
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: vfnc-api
  namespace: dinum
  labels:
    app.kubernetes.io/name: vfnc-api
spec:
  selector:
    app.kubernetes.io/name: vfnc-api
  ports:
    - name: http
      port: 8000
      targetPort: http
