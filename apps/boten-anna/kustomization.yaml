apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boten-anna
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
# Image surveillée par argocd-image-updater (write-back kustomize).
# Le digest courant du tag :main est inscrit via .argocd-source-boten-anna.yaml.
images:
  - name: harbor.valab.top/prod/boten-anna
    newTag: main
